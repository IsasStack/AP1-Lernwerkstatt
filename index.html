<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP1 Lernwerkstatt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14; --bg2:#10161d; --card:#151c25; --card2:#1b2430; --line:#263241; --line2:#334255;
  --tx:#d7dee8; --tx2:#93a1b3; --tx3:#64748b;
  --cy:#38bdf8; --gr:#34d399; --am:#fbbf24; --rd:#f87171; --vi:#a78bfa; --pk:#f472b6;
  --r:14px; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--cy)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--cy);box-shadow:0 0 0 3px #38bdf822}
textarea{min-height:110px;resize:vertical}
code,pre,.mono{font-family:var(--mono)}
/* layout */
header{position:sticky;top:0;z-index:20;background:#0b0f14ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1100px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:17px;cursor:pointer;white-space:nowrap}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--cy),var(--vi));display:grid;place-items:center;color:#0b0f14;font-weight:800;font-size:13px}
.brand small{display:block;font-weight:500;color:var(--tx3);font-size:11px;letter-spacing:0}
.hspace{flex:1}
.cd{font-family:var(--mono);font-size:12px;color:var(--am);background:#fbbf2414;border:1px solid #fbbf2433;padding:4px 9px;border-radius:999px;white-space:nowrap}
.sync{font-size:11px;color:var(--tx3);white-space:nowrap}
nav{max-width:1100px;margin:0 auto;padding:8px 12px 10px;display:flex;flex-wrap:wrap;gap:4px 6px}
nav button{background:transparent;border:1px solid transparent;border-radius:10px;padding:7px 12px;color:var(--tx2);font-weight:600;font-size:13.5px;white-space:nowrap}
nav button:hover{color:var(--tx);background:var(--card)}
nav button.on{color:var(--tx);background:var(--card2);border-color:var(--line2)}
main{max-width:1100px;margin:0 auto;padding:20px 16px 80px;overflow-wrap:anywhere}
main pre,main code,main .mono{overflow-wrap:normal;hyphens:none}
h1{font-size:26px;letter-spacing:-.02em;margin:4px 0 6px;line-height:1.2}
h2{font-size:19px;letter-spacing:-.01em;margin:26px 0 10px}
.sub{color:var(--tx2);margin:0 0 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.click{cursor:pointer;transition:border-color .15s,transform .15s}
.card.click:hover{border-color:var(--line2);transform:translateY(-1px)}
.stat .v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .l{color:var(--tx2);font-size:12.5px;margin-top:3px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--tx3)}
.btn.pri{background:var(--cy);border-color:var(--cy);color:#06121c}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:#34d39922;border-color:#34d39966;color:var(--gr)}
.btn.bad{background:#f8717122;border-color:#f8717166;color:var(--rd)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line2);color:var(--tx2)}
.pill.cy{color:var(--cy);border-color:#38bdf844;background:#38bdf812}
.pill.gr{color:var(--gr);border-color:#34d39944;background:#34d39912}
.pill.am{color:var(--am);border-color:#fbbf2444;background:#fbbf2412}
.pill.rd{color:var(--rd);border-color:#f8717144;background:#f8717112}
.pill.vi{color:var(--vi);border-color:#a78bfa44;background:#a78bfa12}
.bar{height:7px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--gr));border-radius:99px}
.muted{color:var(--tx2)} .dim{color:var(--tx3)} .small{font-size:13px}
.tcard{display:flex;gap:12px;align-items:flex-start}
.tcard .ic{font-size:22px;width:42px;height:42px;border-radius:11px;background:var(--card2);display:grid;place-items:center;flex:none}
.tcard h3{margin:0;font-size:15.5px}
.tcard p{margin:3px 0 8px;color:var(--tx2);font-size:13px;line-height:1.45}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:14px 0 18px;overflow-x:auto}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:9px 12px;color:var(--tx2);font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--tx);border-bottom-color:var(--cy)}
/* lesson */
.lesson{max-width:820px}
.lesson h3{font-size:17px;margin:26px 0 8px;color:#fff;letter-spacing:-.01em;padding-left:10px;border-left:3px solid var(--cy)}
.lesson p,.lesson li{color:var(--tx)}
.lesson ul,.lesson ol{padding-left:22px}
.lesson li{margin:4px 0}
.lesson b{color:#fff}
.lesson table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px;display:block;overflow-x:auto}
.lesson th,.lesson td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.lesson th{background:var(--card2);color:#fff;font-weight:600}
.lesson tr:nth-child(even) td{background:#ffffff04}
.uml{background:#0f141b;border:1px solid var(--line);border-radius:12px;padding:10px;margin:12px 0;overflow-x:auto}
.lesson pre{background:#070a0e;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;font-size:13px;line-height:1.5;color:#c9e6ff}
.lesson code{background:#070a0e;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px;color:#c9e6ff}
.merke,.tip,.warn{border-radius:12px;padding:12px 14px;margin:14px 0;border:1px solid}
.merke{background:#38bdf80d;border-color:#38bdf840}
.merke::before{content:"💡 Merke";display:block;font-weight:700;color:var(--cy);font-size:12px;margin-bottom:4px;letter-spacing:.02em}
.tip{background:#34d3990d;border-color:#34d39940}
.tip::before{content:"✅ Prüfungstipp";display:block;font-weight:700;color:var(--gr);font-size:12px;margin-bottom:4px}
.warn{background:#f871710d;border-color:#f8717140}
.warn::before{content:"⚠️ Achtung";display:block;font-weight:700;color:var(--rd);font-size:12px;margin-bottom:4px}
/* flashcard */
.fc-wrap{perspective:1400px;max-width:640px;margin:0 auto}
.fc{position:relative;min-height:270px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:26px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line2);background:linear-gradient(160deg,var(--card2),var(--card))}
.fc .back{transform:rotateY(180deg);background:linear-gradient(160deg,#12263a,var(--card))}
.fc .face .lab{position:absolute;top:14px;left:18px;font-size:11px;color:var(--tx3);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.fc .front .txt{font-size:20px;font-weight:700;text-align:center;line-height:1.35}
.fc .back .txt{font-size:16px;line-height:1.55}
/* quiz */
.qbox{max-width:760px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.qtext{font-size:17.5px;font-weight:600;line-height:1.5;margin:6px 0 16px;white-space:pre-line}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;margin:8px 0;transition:border-color .12s}
.opt:hover{border-color:var(--tx3)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:12.5px;color:var(--tx2);border:1px solid var(--line2)}
.opt.sel{border-color:var(--cy);background:#38bdf810}
.opt.sel .k{background:var(--cy);color:#06121c;border-color:var(--cy)}
.opt.right{border-color:var(--gr);background:#34d39914}
.opt.right .k{background:var(--gr);color:#06121c;border-color:var(--gr)}
.opt.wrong{border-color:var(--rd);background:#f8717114}
.opt.wrong .k{background:var(--rd);color:#06121c;border-color:var(--rd)}
.fb{border-radius:12px;padding:12px 14px;margin:14px 0;border:1px solid}
.fb.ok{background:#34d39910;border-color:#34d39955}
.fb.no{background:#f8717110;border-color:#f8717155}
.fb.inf{background:#38bdf80c;border-color:#38bdf844}
.fb h4{margin:0 0 4px;font-size:14px}
.sol{white-space:pre-line}
.pts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pts button{min-width:42px}
.qnav{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.qnav button{width:34px;height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--card);font-size:12px;font-weight:600;color:var(--tx2)}
.qnav button.done{background:#38bdf822;color:var(--cy);border-color:#38bdf855}
.qnav button.cur{outline:2px solid var(--am)}
.timer{font-family:var(--mono);font-weight:700;font-size:15px;padding:5px 11px;border-radius:9px;background:var(--card2);border:1px solid var(--line2)}
.timer.low{color:var(--rd);border-color:#f8717166}
/* trainer */
.tr-q{font-size:16px;line-height:1.6;white-space:pre-line}
.tr-q .mono{background:#070a0e;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:#c9e6ff}
.tr-fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:14px 0}
.tr-fields label{display:block;font-size:12.5px;color:var(--tx2);margin-bottom:4px;font-weight:600}
input.okf{border-color:var(--gr);background:#34d39910}
input.badf{border-color:var(--rd);background:#f8717110}
.gridtbl{border-collapse:collapse;margin:10px 0;font-size:13.5px}
.gridtbl th,.gridtbl td{border:1px solid var(--line);padding:5px 6px;text-align:center}
.gridtbl th{background:var(--card2)}
.gridtbl input{width:62px;padding:6px;text-align:center;font-family:var(--mono)}
.gridwrap{overflow-x:auto}
.info-tbl{border-collapse:collapse;font-size:14px;margin:8px 0}
.info-tbl th,.info-tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.info-tbl th{background:var(--card2)}
pre.code{background:#070a0e;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;font-size:13.5px;color:#c9e6ff;white-space:pre}
/* misc */
.search{position:relative}
.search input{padding-left:36px;font-size:15px}
.search::before{content:"🔎";position:absolute;left:11px;top:9px;font-size:14px;opacity:.7}
.hit{padding:12px 14px;border-bottom:1px solid var(--line)}
.hit:last-child{border-bottom:none}
.hit mark{background:#fbbf2433;color:#fff;border-radius:3px;padding:0 2px}
.empty{color:var(--tx3);text-align:center;padding:30px}
.ring{width:118px;height:118px;flex:none}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--tx2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);padding:10px 16px;border-radius:12px;z-index:50;font-weight:600;box-shadow:0 10px 30px #0008;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.chk{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);cursor:pointer;font-size:13.5px;user-select:none}
.chk input{width:auto;accent-color:var(--cy)}
.chk.on{border-color:#38bdf866}
.phase{border-left:3px solid var(--line2);padding:2px 0 2px 14px;margin:12px 0}
.phase.now{border-left-color:var(--am)}
.phase h4{margin:0 0 3px}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:3px;gap:3px}
.seg button{border:none;background:none;padding:6px 11px;border-radius:7px;color:var(--tx2);font-weight:600;font-size:13px}
.seg button.on{background:var(--card2);color:var(--tx)}
@media (max-width:900px){ .hwrap .sync{display:none} .brand small{display:none} }
@media (max-width:640px){
  h1{font-size:22px} .hwrap .sync{display:none} .brand small{display:none}
  .fc{min-height:300px} .fc .front .txt{font-size:18px}
  main{padding:14px 12px 80px} .cdx{display:none}
  main{hyphens:auto} header{position:static} nav{gap:4px;padding:8px 10px 10px} nav button{padding:6px 9px;font-size:13px}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand" onclick="go('start')"><div class="logo">AP1</div><div>Lernwerkstatt<small>Fachinformatiker · Einrichten eines IT-gestützten Arbeitsplatzes</small></div></div>
    <div class="hspace"></div>
    <span class="sync" id="sync">💾 im Browser gespeichert</span>
    <span class="cd" id="cd"></span>
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>const T=[];</script>
<script>
T.push({
id:"pruefung", title:"Prüfung & Strategie", icon:"🎯", area:"Basis", weight:2,
summary:"Ablauf, Gewichtung, Operatoren, Zeitmanagement – wie du Punkte holst.",
lesson:`
<h3>Rahmen der AP1</h3>
<table><tr><th>Merkmal</th><th>AP1 „Einrichten eines IT-gestützten Arbeitsplatzes“</th></tr>
<tr><td>Termin</td><td>Mittwoch, <b>24.02.2027</b> (bundeseinheitlich, AkA), Beginn i. d. R. 8 Uhr</td></tr>
<tr><td>Dauer</td><td>90 Minuten, schriftlich, offene Aufgaben (+ teils gebundene)</td></tr>
<tr><td>Gewichtung</td><td>20 % der Gesamtnote – identisch für alle IT-Berufe</td></tr>
<tr><td>Grundlage</td><td>Ausbildungsrahmenplan Monate 1–18 (§ 4 FIAusbV) + AkA-Prüfungskatalog, 2. Auflage (gilt seit Frühjahr 2025)</td></tr>
<tr><td>Hilfsmittel</td><td>Nicht programmierbarer, netzunabhängiger Taschenrechner, Schreibzeug, Lineal – Einladung prüfen!</td></tr></table>
<div class="merke"><b>Bestehen:</b> AP1 hat keine eigene Sperrnote. Gesamtergebnis (AP1 20 % + AP2 80 %) muss ≥ 50 Punkte sein, und die AP2-Bereiche haben eigene Mindestanforderungen. Eine schwache AP1 erhöht nur den Druck auf die AP2.</div>
<h3>Was der neue Katalog (ab 2025) bedeutet</h3>
<p><b>Gestrichen</b> (nicht mehr AP1): SQL & Datenbanken, RAID/SAN, Struktogramm & PAP, Vererbung/Polymorphie, Vorgehensmodelle außer Wasserfall & Scrum (z. B. Kanban, XP), SWOT, Mobilfunkstandards im Detail, ISO-2700x-Details.</p>
<p><b>Neu bzw. betont:</b> KI-Software am Arbeitsplatz, ERP/CRM/SCM, Clients in Domänen einbinden, IPv4 vs. IPv6, DSGVO-Betroffenenrechte, Barrierefreiheit (Websites & Hardware), Härtung, Hashverfahren, 2FA, Amortisationszeit, SMART-Ziele, UML-Aktivitätsdiagramm, Schreibtischtest.</p>
<h3>Operatoren – was die Aufgabe wirklich verlangt</h3>
<table><tr><th>Operator</th><th>Erwartung</th></tr>
<tr><td>Nennen</td><td>Stichwort reicht, keine Erklärung</td></tr>
<tr><td>Beschreiben</td><td>Sachverhalt in eigenen Worten, zusammenhängend</td></tr>
<tr><td>Erläutern / Erklären</td><td>Beschreiben + Zusammenhänge/Gründe („weil …“), ggf. Beispiel</td></tr>
<tr><td>Begründen</td><td>Entscheidung + fachliches Argument mit Bezug zur Situation</td></tr>
<tr><td>Berechnen</td><td>Rechenweg + Ergebnis + Einheit</td></tr>
<tr><td>Vergleichen / Unterscheiden</td><td>Gemeinsamkeiten und Unterschiede je Kriterium gegenüberstellen</td></tr>
<tr><td>Beurteilen / Bewerten</td><td>Kriteriengestütztes eigenes Urteil</td></tr>
<tr><td>Ergänzen / Vervollständigen</td><td>Tabelle, Diagramm oder Code direkt ausfüllen</td></tr></table>
<h3>Zeitmanagement</h3>
<ul><li>Faustregel: <b>1 Punkt ≈ 1 Minute</b> (100 Punkte, 90 Min. → etwas Puffer einplanen).</li>
<li>Erst die Ausgangssituation lesen: Firma, Abteilung, Nutzer, Anforderungen markieren.</li>
<li>Hängst du bei einer Rechnung (Subnetting, Netzplan) fest: markieren, weiter, später zurück.</li>
<li>Bei „Nennen Sie drei …“ werden nur die ersten drei gewertet – nicht fünf hinschreiben.</li></ul>
<h3>Die Begründungsformel</h3>
<div class="tip"><b>Entscheidung + weil + Fachargument + Bezug zur Situation.</b><br>Schwach: „LAN, weil besser.“<br>Stark: „Für den festen Videoschnittplatz empfehle ich eine kabelgebundene Gigabit-Ethernet-Verbindung, da sie Vollduplex bietet, nicht durch Funkstörungen beeinträchtigt wird und so die konstante Bandbreite für große Videodateien garantiert.“</div>
<div class="warn">Abkürzungen (DHCP, PoE, ERP …) nur verwenden, wenn du ihre Funktion in einem Satz erklären kannst – die Prüfer werten die Erklärung, nicht das Kürzel.</div>`,
cards:[
["Wann ist die AP1 Frühjahr 2027?","Mittwoch, 24.02.2027 – bundeseinheitlich (AkA), Beginn in der Regel 8 Uhr."],
["Wie stark zählt die AP1?","20 % der Gesamtnote, 90 Minuten schriftlich, für alle IT-Berufe identisch."],
["Kann man in der AP1 „durchfallen“?","Nicht isoliert – es gibt keine Sperrnote. Aber ein schwaches Ergebnis muss in der AP2 (80 %) ausgeglichen werden."],
["Operator „Nennen“","Stichworte genügen, keine Erklärung nötig."],
["Operator „Erläutern“","Beschreiben + Zusammenhänge/Ursachen erklären, gern mit Beispiel."],
["Operator „Begründen“","Entscheidung + fachliches Argument + Bezug zur Ausgangssituation."],
["Zeitregel in der Prüfung","1 Punkt ≈ 1 Minute. Blockaden überspringen und später zurückkehren."],
["Welche Themen sind seit 2025 aus der AP1 raus?","SQL-Abfragen und NoSQL (relationale DB-Grundlagen bleiben!), RAID/SAN, Struktogramm/PAP, Vererbung, Kanban/XP/SWOT, LTE/5G, ISO 2700x, Eisbergmodell, Fragetechniken, Cross-/Upselling, Suchoperatoren, Audit, Abnahmeprotokoll, Deckungsbeitrag."],
["Welche Themen sind seit 2025 neu/betont?","Projektmerkmale, SMART, KI, Sensoren, Client-Server, DaaS, Domäne, IPv4/IPv6, HDD/SSD, Datenmengen, Klassen/Sichtbarkeit, Aktivitätsdiagramm, Schreibtischtest, Corporate Identity, Schutzziele, Hash, 2FA, Härtung, Anonymisierung, Betroffenenrechte/Einwilligung, Barrierefreiheit."],
["Wie heißt der Prüfungsbereich der AP1?","„Einrichten eines IT-gestützten Arbeitsplatzes“."]
],
qs:[
{t:"sc",q:"Mit welchem Anteil fließt die AP1 in die Gesamtnote ein?",o:["10 %","20 %","25 %","50 %"],a:1,e:"AP1 = 20 %, AP2 = 80 % (verteilt auf Projekt, zwei schriftliche Bereiche und WiSo)."},

id:"projekt", title:"Projektmanagement", icon:"📋", area:"Planung", weight:3,
summary:"Projektmerkmale, Phasen, SMART, Wasserfall vs. Scrum, Gantt, Netzplan.",
lesson:`
<h3>Was ist ein Projekt?</h3>
<p>Ein Vorhaben, das im Wesentlichen durch <b>Einmaligkeit</b> der Bedingungen gekennzeichnet ist (DIN 69901): klares <b>Ziel</b>, <b>zeitliche Begrenzung</b> (Start/Ende), begrenzte <b>Ressourcen</b> (Budget, Personal), eigene <b>Projektorganisation</b>, Komplexität/Risiko, oft interdisziplinär.</p>
<div class="merke"><b>Magisches Dreieck:</b> Leistung/Qualität – Zeit – Kosten. Änderst du eine Ecke, wirkt sich das auf die anderen aus (mehr Leistung ⇒ mehr Zeit oder Kosten).</div>
<h3>Projektphasen (klassisch)</h3>
<p>Initialisierung → Definition/Planung → Durchführung → Abschluss (begleitend: Controlling). Phasen enden mit <b>Meilensteinen</b> = Ereignisse ohne Dauer, an denen ein Ergebnis überprüft wird.</p>
<h3>Vorbereitung: Machbarkeit & Umfeld</h3>
<ul><li><b>Machbarkeitsanalyse</b>: technisch, wirtschaftlich, rechtlich (DSGVO!), terminlich, personell.</li>
<li><b>Stakeholderanalyse</b>: Wer ist betroffen/beteiligt? Einfluss & Einstellung (Promotoren, Kritiker).</li>
<li><b>Risikoanalyse</b>: Risiko = Eintrittswahrscheinlichkeit × Schadenshöhe; Maßnahmen vermeiden, vermindern, übertragen, akzeptieren.</li>
<li><b>Lastenheft</b> (Auftraggeber: WAS & WOFÜR) → <b>Pflichtenheft</b> (Auftragnehmer: WIE & WOMIT).</li></ul>
<h3>SMART-Ziele</h3>
<table><tr><th>Buchstabe</th><th>Bedeutung</th><th>Beispiel</th></tr>
<tr><td>S</td><td>Spezifisch – eindeutig</td><td>„Alle 25 Arbeitsplätze der Buchhaltung …“</td></tr>
<tr><td>M</td><td>Messbar</td><td>„… mit Windows 11 und BitLocker …“</td></tr>
<tr><td>A</td><td>Attraktiv/akzeptiert (achievable)</td><td>vom Team getragen</td></tr>
<tr><td>R</td><td>Realistisch</td><td>mit vorhandenen Ressourcen erreichbar</td></tr>
<tr><td>T</td><td>Terminiert</td><td>„… bis 31.03. ausgestattet.“</td></tr></table>
<h3>Vorgehensmodelle: Wasserfall vs. Scrum</h3>
<table><tr><th></th><th>Wasserfall</th><th>Scrum (agil)</th></tr>
<tr><td>Ablauf</td><td>sequenzielle Phasen: Analyse → Entwurf → Implementierung → Test → Einsatz/Wartung</td><td>iterativ in Sprints (1–4 Wochen), am Ende jeweils ein nutzbares Inkrement</td></tr>
<tr><td>Anforderungen</td><td>vollständig zu Beginn festgelegt</td><td>im Product Backlog, laufend priorisiert & änderbar</td></tr>
<tr><td>Stärken</td><td>Planungssicherheit, klare Dokumentation, gut bei stabilen Anforderungen</td><td>Flexibilität, frühes Kundenfeedback, Transparenz</td></tr>
<tr><td>Schwächen</td><td>Änderungen teuer, Fehler spät entdeckt, Kunde sieht Ergebnis spät</td><td>Gesamtkosten/-termin schwer planbar, hohe Kundenbeteiligung nötig</td></tr></table>
<p><b>Scrum-Rollen:</b> Product Owner (Wert, Backlog, Prioritäten), Scrum Master (Prozess, Hindernisse beseitigen), Developers (selbstorganisiert, liefern Inkrement).<br>
<b>Events:</b> Sprint, Sprint Planning, Daily Scrum (15 Min.), Sprint Review (Ergebnis mit Stakeholdern), Sprint Retrospektive (Zusammenarbeit verbessern).<br>
<b>Artefakte:</b> Product Backlog, Sprint Backlog, Increment (+ Definition of Done).</p>
<h3>Planungswerkzeuge</h3>
<ul><li><b>Projektstrukturplan (PSP)</b>: hierarchische Zerlegung in Teilaufgaben und Arbeitspakete – <i>was</i> ist zu tun (ohne Zeit).</li>
<li><b>Gantt-Diagramm</b> (Balkenplan): Vorgänge als Balken auf Zeitachse – anschaulich, Abhängigkeiten nur begrenzt sichtbar.</li>
<li><b>Netzplan</b>: Vorgänge mit Abhängigkeiten, Puffern, kritischem Pfad.</li></ul>
<h3>Netzplantechnik (Vorgangsknoten)</h3>
<pre>┌─────┬─────┬─────┐
│ FAZ │  D  │ FEZ │
├─────┴─────┴─────┤
│  Nr / Vorgang   │
├─────┬─────┬─────┤
│ SAZ │ GP  │ SEZ │
└─────┴─────┴─────┘</pre>
<ol><li><b>Vorwärtsrechnung:</b> FEZ = FAZ + D. FAZ eines Nachfolgers = <b>größter</b> FEZ aller Vorgänger.</li>
<li><b>Rückwärtsrechnung:</b> Am Ende SEZ = FEZ. SAZ = SEZ − D. SEZ eines Vorgängers = <b>kleinster</b> SAZ aller Nachfolger.</li>
<li><b>Gesamtpuffer</b> GP = SAZ − FAZ (= SEZ − FEZ): so viel darf sich der Vorgang verzögern, ohne das Projektende zu verschieben.</li>
<li><b>Freier Puffer</b> FP = kleinster FAZ der Nachfolger − FEZ: Verzögerung ohne Auswirkung auf Nachfolger.</li>
<li><b>Kritischer Pfad</b>: lückenlose Kette mit GP = 0 – jede Verzögerung verschiebt das Projektende.</li></ol>
<div class="tip">Start-Konvention: Meist beginnt der erste Vorgang bei FAZ = 0. Manche Aufgaben starten mit 1 – dann gilt FEZ = FAZ + D − 1. Lies die Vorgabe genau!</div>
<p><b>Terminprobleme lösen:</b> Vorgänge parallelisieren, Ressourcen auf dem kritischen Pfad erhöhen, Umfang reduzieren, Puffer nutzen, Überstunden/externe Kräfte.</p>
<h3>Abschluss</h3>
<p>Abnahme (Abnahmeprotokoll), Soll-Ist-Vergleich, Abweichungsanalyse, <b>Lessons Learned</b>, Projektdokumentation, Auflösung des Teams. <b>Teamentwicklung nach Tuckman:</b> Forming → Storming → Norming → Performing (→ Adjourning).</p>`,

id:"kunde", title:"Kundenberatung & Kommunikation", icon:"🗣️", area:"Planung", weight:2,
summary:"Kommunikationsmodelle, Fragetechniken, Bedarfsanalyse, Support, Markt & Organisation.",
lesson:`
<h3>Kommunikationsmodelle</h3>
<ul><li><b>Sender-Empfänger-Modell</b> (Shannon/Weaver): Sender codiert Nachricht → Kanal (mit Störungen) → Empfänger decodiert. Missverständnisse entstehen, wenn Codes (Fachsprache!) nicht übereinstimmen.</li>
<li><b>Vier-Seiten-Modell / 4-Ohren-Modell</b> (Schulz von Thun): Jede Nachricht hat <b>Sachinhalt</b> (Worüber informiere ich?), <b>Selbstoffenbarung</b> (Was gebe ich von mir preis?), <b>Beziehung</b> (Was halte ich von dir?), <b>Appell</b> (Wozu will ich dich veranlassen?).</li>
<li><b>Eisbergmodell</b>: Nur ca. 20 % der Kommunikation sind sichtbar (Sachebene: Zahlen, Fakten), ca. 80 % liegen unter der Oberfläche (Beziehungsebene: Gefühle, Werte, Erfahrungen).</li></ul>
<div class="merke">Beispiel 4-Ohren: Kunde sagt „Der Drucker geht schon wieder nicht!“ – Sache: Drucker defekt. Selbstoffenbarung: Ich bin genervt. Beziehung: Ihr kriegt das nicht hin. Appell: Repariert es endlich dauerhaft!</div>
<h3>Gesprächsführung & Fragetechniken</h3>
<table><tr><th>Fragetyp</th><th>Zweck</th><th>Beispiel</th></tr>
<tr><td>Offene Frage (W-Frage)</td><td>Informationen sammeln, Bedarf ermitteln</td><td>„Welche Programme nutzen Sie täglich?“</td></tr>
<tr><td>Geschlossene Frage</td><td>Bestätigung, Ja/Nein</td><td>„Arbeiten Sie auch mobil?“</td></tr>
<tr><td>Alternativfrage</td><td>Entscheidung herbeiführen</td><td>„Lieber 24 oder 27 Zoll?“</td></tr>
<tr><td>Suggestivfrage</td><td>lenkt – im Beratungsgespräch vermeiden</td><td>„Sie wollen doch sicher das Premium-Modell?“</td></tr>
<tr><td>Kontrollfrage</td><td>Verständnis sichern</td><td>„Habe ich richtig verstanden, dass …?“</td></tr></table>
<p><b>Aktives Zuhören:</b> Blickkontakt, nicken, nicht unterbrechen, paraphrasieren („Sie meinen also …“), nachfragen, Gefühle spiegeln. <b>Ich-Botschaften</b> statt Du-Vorwürfe.</p>
<h3>Bedarfsanalyse & Zielgruppe</h3>
<p>Ist-Zustand aufnehmen → Anforderungen ermitteln (funktional/nicht-funktional) → Soll-Konzept. Datenquellen: <b>Kundenbefragung</b> (Interview, Fragebogen – Primärdaten) und <b>Auswertung vorhandener Daten</b> (Ticketstatistiken, Inventar – Sekundärdaten). Technische Sachverhalte zielgruppengerecht erklären: Analogien, wenig Fachbegriffe, Visualisierung.</p>
<h3>Präsentation & Medien</h3>
<p>Qualitätsmerkmale: klare Struktur (Einleitung–Hauptteil–Schluss), wenig Text pro Folie, große Schrift, Visualisierungen, Zeitrahmen, Blickkontakt, Zielgruppe beachten. Medien: Webinar, Online-Schulung, Video-Tutorial, FAQ/Wiki, Homepage, Handout.</p>
<h3>Verkauf</h3>
<p><b>Upselling</b>: höherwertige Variante verkaufen (16 GB → 32 GB RAM). <b>Cross-Selling</b>: ergänzende Produkte (Notebook + Dockingstation + Garantieverlängerung).</p>
<h3>Support & Störungsmanagement</h3>
<ul><li><b>Ticketsystem</b>: Erfassung, Priorisierung, Zuweisung, Bearbeitungsstatus (neu, in Bearbeitung, wartend, gelöst, geschlossen), Dokumentation, Wissensdatenbank, Auswertung/SLA-Kontrolle.</li>
<li><b>Support-Level</b>: 1st Level (Service Desk, Annahme, Standardlösungen) → 2nd Level (Fachspezialisten) → 3rd Level (Hersteller/Entwickler).</li>
<li><b>Priorität</b> = Dringlichkeit × Auswirkung. <b>Incident</b> = Störung (schnell wiederherstellen), <b>Problem</b> = Ursache (dauerhaft beheben).</li>
<li>Eskalation: funktional (an höheren Level) oder hierarchisch (an Vorgesetzte).</li></ul>
<h3>Markt & Unternehmen</h3>
<table><tr><th>Marktform</th><th>Anbieter</th><th>Nachfrager</th></tr>
<tr><td>Polypol</td><td>viele</td><td>viele</td></tr><tr><td>Oligopol</td><td>wenige</td><td>viele</td></tr><tr><td>Monopol</td><td>einer</td><td>viele</td></tr></table>
<p><b>Käufermarkt</b>: Angebot &gt; Nachfrage → Käufer hat Macht, Preise sinken. <b>Verkäufermarkt</b>: Nachfrage &gt; Angebot. <b>Vertrieb</b>: direkt (Hersteller → Kunde, z. B. Onlineshop) vs. indirekt (über Händler/Systemhaus).</p>
<p><b>Aufbauorganisation:</b> <i>Einliniensystem</i> (jede Stelle hat genau einen Vorgesetzten – klar, aber lange Dienstwege), <i>Mehrliniensystem</i> (mehrere fachliche Vorgesetzte – kurze Wege, aber Kompetenzkonflikte), <i>Matrixorganisation</i> (Funktions- und Projekt-/Produktlinie überlagert – flexibel, aber Konfliktpotenzial). <b>Vollmachten:</b> Prokura (fast alle Geschäfte, im Handelsregister) &gt; Handlungsvollmacht.</p>
<h3>Veränderungsprozesse (Change)</h3>
<p>Rollout neuer Systeme erzeugt Widerstände (Angst vor Kompetenzverlust, Wissenslücken, schlechte Erfahrungen). Maßnahmen: früh informieren, Betroffene beteiligen, Chancen betonen, Schulungen (Blended Learning, Multiplikatoren/Key-User), <b>Promotoren</b> gewinnen, Bedenken von Skeptikern ernst nehmen.</p>`,

lesson:`
<h3>Kostenarten</h3>
<ul><li><b>Fixkosten</b>: unabhängig von der Menge/Nutzung (Miete, Leasingrate, Wartungspauschale, Abschreibung).</li>
<li><b>Variable Kosten</b>: abhängig von der Nutzung (Strom, Toner pro Seite, Pay-per-Use).</li>
<li><b>Einmalige Kosten</b>: Anschaffung, Installation, Einrichtung, Schulung. <b>Laufende Kosten</b>: Strom, Lizenzen (Abo), Support, Wartung.</li>
<li><b>TCO (Total Cost of Ownership)</b>: alle Kosten über die gesamte Nutzungsdauer – Anschaffung + Betrieb + Wartung + Entsorgung.</li></ul>
<div class="merke">Gesamtkosten K = Kfix + kvar × Menge. Stückkosten = K / Menge.</div>
<h3>Kostenvergleich & Break-even</h3>
<p>Zwei Alternativen: A hat Fixkosten 1.000 € und 0,05 €/Seite, B hat 400 € und 0,08 €/Seite. Gleichsetzen: 1000 + 0,05x = 400 + 0,08x → 600 = 0,03x → <b>x = 20.000 Seiten</b>. Darunter ist B günstiger, darüber A.</p>
<h3>Amortisationsrechnung</h3>
<p>Wann hat sich eine Investition durch Einsparungen „bezahlt gemacht“?</p>
<div class="merke"><b>Amortisationszeit = Anschaffungskosten ÷ jährliche (bzw. monatliche) Einsparung</b><br>Beispiel: Neue Server kosten 12.000 €, sparen 400 €/Monat an Strom und Wartung → 12.000 / 400 = <b>30 Monate</b>.</div>
<p>Bei laufenden Mehrkosten der neuen Lösung: Einsparung = alte laufende Kosten − neue laufende Kosten.</p>
<h3>Kauf, Miete, Leasing, Pay-per-Use</h3>
<table><tr><th>Form</th><th>Vorteile</th><th>Nachteile</th></tr>
<tr><td>Kauf</td><td>Eigentum, langfristig oft günstigste Variante, freie Verfügung</td><td>hohe Kapitalbindung, Risiko der Veralterung, Wartung selbst</td></tr>
<tr><td>Miete</td><td>flexibel, kurze Laufzeiten, keine Kapitalbindung</td><td>teuer bei langer Nutzung, kein Eigentum</td></tr>
<tr><td>Leasing</td><td>Liquidität bleibt erhalten, planbare Raten, regelmäßige Erneuerung, oft steuerlich als Aufwand</td><td>insgesamt teurer als Kauf, Vertragsbindung, kein Eigentum</td></tr>
<tr><td>Pay-per-Use</td><td>nur tatsächliche Nutzung zahlen, skalierbar (Cloud)</td><td>Kosten schwer planbar bei schwankender Nutzung</td></tr></table>
<h3>Nutzwertanalyse (Scoring-Modell)</h3>
<ol><li>Kriterien festlegen (Preis, Leistung, Ergonomie, Energie, Service …).</li>
<li>Kriterien gewichten (Summe 100 % bzw. 1,0).</li>
<li>Jede Alternative je Kriterium bewerten (z. B. 1–10 Punkte).</li>
<li>Teilnutzen = Gewichtung × Punkte.</li>
<li>Gesamtnutzwert = Summe der Teilnutzen → höchster Wert gewinnt.</li></ol>
<table><tr><th>Kriterium</th><th>Gewicht</th><th>A (Pkt)</th><th>A (TN)</th><th>B (Pkt)</th><th>B (TN)</th></tr>
<tr><td>Preis</td><td>40 %</td><td>8</td><td>3,2</td><td>6</td><td>2,4</td></tr>
<tr><td>Leistung</td><td>35 %</td><td>5</td><td>1,75</td><td>9</td><td>3,15</td></tr>
<tr><td>Service</td><td>25 %</td><td>7</td><td>1,75</td><td>6</td><td>1,5</td></tr>
<tr><td><b>Summe</b></td><td>100 %</td><td></td><td><b>6,7</b></td><td></td><td><b>7,05</b></td></tr></table>
<p>→ B gewinnt. Vorteil: qualitative und quantitative Kriterien vergleichbar. Nachteil: Gewichtung/Punkte sind subjektiv.</p>
<h3>Angebotsvergleich (quantitativ)</h3>
<pre>  Listenpreis
− Rabatt (%)
= Zieleinkaufspreis
− Skonto (%)  (bei Zahlung innerhalb der Frist)
= Bareinkaufspreis
+ Bezugskosten (Versand, Verpackung, Installation)
= Bezugspreis (Einstandspreis)</pre>
<p>Netto/Brutto: Brutto = Netto × 1,19 (USt 19 %); Netto = Brutto ÷ 1,19. <b>Qualitativ</b>: Lieferzeit, Service, Garantie, Zuverlässigkeit, Nachhaltigkeit des Lieferanten.</p>
<h3>Kennzahlen</h3>
<p>Umsatz = Preis × Menge. Gewinn = Umsatz − Kosten. <b>Deckungsbeitrag</b> = Umsatz − variable Kosten (deckt die Fixkosten). Break-even-Menge = Fixkosten ÷ Stückdeckungsbeitrag. Abschreibung linear = Anschaffungskosten ÷ Nutzungsdauer (PCs i. d. R. 3 Jahre, digitale WG seit 2021 auch sofort möglich).</p>
<h3>Prozentrechnung – Kurzform</h3>
<p>Prozentwert = Grundwert × p / 100. Erhöhung um p %: × (1 + p/100). Rückwärts von brutto auf netto: ÷ 1,19, nicht × 0,81!</p>`,

summary:"Vertragsarten, SLA, Mängel & Verzug, Lizenzmodelle, Abnahme und Dokumentation.",
lesson:`
<h3>Vertragsarten (BGB)</h3>
<table><tr><th>Vertrag</th><th>Geschuldet wird</th><th>IT-Beispiel</th></tr>
<tr><td>Kaufvertrag (§ 433)</td><td>Übergabe & Eigentum an einer Sache gegen Kaufpreis</td><td>Kauf von 20 Monitoren</td></tr>
<tr><td>Werkvertrag (§ 631)</td><td>ein <b>Erfolg</b> (fertiges Werk), Abnahme nötig</td><td>Individualsoftware erstellen, Netzwerk installieren</td></tr>
<tr><td>Dienstvertrag (§ 611)</td><td>eine <b>Tätigkeit</b>, kein Erfolg</td><td>Beratung, Schulung, Support nach Stunden</td></tr>
<tr><td>Mietvertrag (§ 535)</td><td>Gebrauchsüberlassung gegen Miete</td><td>Server für 6 Monate mieten</td></tr>
<tr><td>Leasingvertrag</td><td>Nutzung gegen Raten, Sonderform der Miete</td><td>Notebook-Flotte leasen</td></tr>
<tr><td>Lizenzvertrag</td><td>Nutzungsrecht an Software</td><td>Microsoft-365-Abo</td></tr>
<tr><td>Werklieferungsvertrag (§ 650)</td><td>Herstellung beweglicher Sachen (Kaufrecht gilt)</td><td>speziell konfigurierte PCs bauen</td></tr></table>
<p><b>Zustandekommen:</b> Antrag + Annahme (zwei übereinstimmende Willenserklärungen). Ein Angebot an die Allgemeinheit (Onlineshop, Katalog) ist nur eine Aufforderung zur Abgabe eines Angebots.</p>
<h3>SLA – Service Level Agreement</h3>
<p>Vereinbarung über messbare Leistungsqualität: <b>Verfügbarkeit</b> (z. B. 99,9 %), <b>Reaktionszeit</b>, <b>Wiederherstellungszeit</b>, Servicezeiten (z. B. Mo–Fr 8–18 Uhr), Eskalation, Berichte, Vertragsstrafen.</p>
<div class="merke">Verfügbarkeit 99,9 % pro Jahr ⇒ erlaubte Ausfallzeit = 0,1 % × 8.760 h = <b>8,76 Stunden</b>. 99 % ⇒ 87,6 h.</div>
<h3>Vertragsstörungen</h3>
<ul><li><b>Mangelhafte Lieferung</b> (Schlechtleistung): Sachmangel (Ware defekt, falsche Beschaffenheit), Falschlieferung, Minderlieferung (zu wenig), Montagemangel, Rechtsmangel.</li>
<li><b>Rechte des Käufers</b>: zuerst <b>Nacherfüllung</b> (Nachbesserung oder Ersatzlieferung), danach Rücktritt, Minderung, Schadensersatz.</li>
<li>Gewährleistung: gesetzlich 2 Jahre. <b>Garantie</b>: freiwillige Zusage des Herstellers/Händlers.</li>
<li>Mängelarten nach Erkennbarkeit: offen, versteckt, arglistig verschwiegen. Beim zweiseitigen Handelskauf: unverzügliche Prüf- und Rügepflicht (§ 377 HGB).</li>
<li><b>Lieferungsverzug</b>: Lieferung fällig, schuldhaft nicht erfolgt (ggf. Mahnung nötig, entbehrlich bei kalendermäßig bestimmtem Termin). <b>Zahlungsverzug</b>: spätestens 30 Tage nach Fälligkeit und Rechnungszugang.</li>
<li><b>Konventionalstrafe</b>: vereinbarte Vertragsstrafe bei Nichteinhaltung (z. B. pro Tag Verzug).</li></ul>
<h3>Urheberrecht & Lizenzen</h3>
<p>Software ist durch das <b>Urheberrechtsgesetz (UrhG)</b> geschützt; der Nutzer erwirbt nur ein Nutzungsrecht (Lizenz).</p>
<table><tr><th>Modell</th><th>Merkmal</th></tr>
<tr><td>EULA</td><td>Endbenutzer-Lizenzvertrag, regelt Nutzungsbedingungen</td></tr>
<tr><td>OEM</td><td>an Hardware gebunden, günstig, i. d. R. nicht übertragbar</td></tr>
<tr><td>Einzelplatz / Volumen</td><td>ein Gerät bzw. viele Lizenzen mit Mengenrabatt</td></tr>
<tr><td>Named User / Concurrent User</td><td>pro benannter Person / pro gleichzeitig angemeldeter Nutzer</td></tr>
<tr><td>Subscription (Abo)</td><td>zeitlich begrenzt, laufende Updates, z. B. SaaS</td></tr>
<tr><td>Pay-per-Use</td><td>Abrechnung nach tatsächlicher Nutzung</td></tr>
<tr><td>Freeware / Shareware</td><td>kostenlos (Quellcode meist geschlossen) / kostenlos testen, dann zahlen</td></tr>
<tr><td>Open Source – GPL</td><td><b>Copyleft</b>: Quellcode offen, Änderungen müssen unter GPL weitergegeben werden</td></tr>
<tr><td>Open Source – MIT/BSD/Apache</td><td>permissiv: auch in proprietärer Software nutzbar, Lizenzhinweis beibehalten</td></tr></table>
<p><b>Proprietär</b> = Quellcode geschlossen, Hersteller bestimmt Nutzung. <b>Open Source</b> = Quellcode einsehbar, ändern & weitergeben erlaubt (Lizenzbedingungen beachten).</p>
<h3>Leistungserbringung & Abnahme</h3>
<ul><li><b>Rollout</b>: Vorbereitung (Scope, Inventar, Images), Kunden-Onboarding, Formalitäten, Umsetzung, Nachbetreuung. Vor Ort vs. remote.</li>
<li><b>Abnahmeprotokoll</b>: Gegenstand der Abnahme, beteiligte Personen, Ort, Datum/Uhrzeit, geprüfte Funktionen, festgestellte Mängel und Fristen, Unterschriften.</li>
<li><b>Dokumentation</b>: Benutzerhandbuch, Administrations-/Netzwerkdokumentation, Programmdokumentation/Quellcode, Schnittstellen, Testprotokolle, Konfigurationen.</li>
<li>Stilllegung von Altsystemen: Daten migrieren, gesetzliche <b>Aufbewahrungsfristen</b> beachten (Handelsbriefe 6 Jahre, Buchungsbelege/Rechnungen 8 Jahre seit 2025, Bücher/Jahresabschlüsse 10 Jahre), Datenträger sicher löschen.</li></ul>`,

T.push({
id:"auswahl", title:"Produktauswahl & Lizenzierung", icon:"🛒", area:"Planung", weight:3,
summary:"Welche Hardware, welches Betriebssystem, welche Software und Lizenz passt zu welcher Firma – mit Begründung.",
lesson:`
<h3>So gehst du jede Auswahlaufgabe an</h3>
<ol><li><b>Situation lesen und markieren:</b> Wie viele Nutzer? Was machen sie (Office, Grafik, CAD, Entwicklung, Kasse, Lager)? Mobil oder stationär? Domäne/Cloud vorhanden? Budget? Datenschutz? Besondere Bedürfnisse (Barrierefreiheit, Schichtbetrieb, Kundenkontakt)?</li>
<li><b>Anforderungen ableiten:</b> funktional (was muss es können) und nicht-funktional (Leistung, Sicherheit, Ergonomie, Kosten, Wartbarkeit, Nachhaltigkeit).</li>
<li><b>Entscheiden und begründen:</b> Produkt/Variante + „weil“ + Bezug zur Situation. Immer den <i>Grund aus dem Text</i> nennen.</li></ol>
<div class="tip">Die IHK will kein Markenwissen, sondern passende Klassen und Eigenschaften: „Business-Notebook mit SSD, 16 GB RAM, TPM 2.0 und USB-C-Docking“ – nicht „Lenovo T14 Gen 5“.</div>
<h3>Hardware nach Arbeitsplatztyp</h3>
<table><tr><th>Arbeitsplatz</th><th>Empfehlung</th><th>Begründung</th></tr>
<tr><td>Büro/Verwaltung (Office, ERP, Mail)</td><td>Desktop oder Mini-PC bzw. Business-Notebook mit Docking; i5/Ryzen 5, 16 GB RAM, 512 GB SSD, 2 × 24″ Full HD/WQHD</td><td>ausreichend Leistung, günstig, zwei Monitore steigern Produktivität, ergonomisch</td></tr>
<tr><td>Außendienst/Vertrieb</td><td>leichtes Business-Notebook (13–14″), SSD, lange Akkulaufzeit, ggf. LTE/5G-Modem, TPM, Fingerabdruck/IR-Kamera, Docking im Büro</td><td>mobil, stoßfest, offline arbeitsfähig, Diebstahlschutz durch BitLocker, Windows Hello</td></tr>
<tr><td>Grafik/Foto/Video</td><td>Workstation mit starker CPU, 32–64 GB RAM, dedizierte GPU, schnelle NVMe-SSD, farbkalibrierbarer IPS-Monitor (hoher Farbraum, 4K)</td><td>rechenintensive Programme, große Dateien, farbverbindliches Arbeiten</td></tr>
<tr><td>CAD/Konstruktion</td><td>Workstation mit zertifizierter Profi-GPU, viel RAM (ggf. ECC), großer Monitor</td><td>Herstellerzertifizierung der CAD-Software, Stabilität</td></tr>
<tr><td>Softwareentwicklung</td><td>Notebook/Desktop mit 32 GB RAM, schneller SSD, Windows Pro (Hyper-V/WSL) oder Linux, 2 Monitore</td><td>VMs/Container, Compiler, IDE brauchen RAM und schnelle Datenträger</td></tr>
<tr><td>Callcenter/Sachbearbeitung mit Standardaufgaben</td><td>Thin Client + Terminalserver/VDI, Headset</td><td>zentral verwaltet, günstig, sparsam, sicher (keine lokalen Daten), schnell austauschbar</td></tr>
<tr><td>Lager/Produktion</td><td>robustes (rugged) Tablet/Handheld mit Barcodescanner, IP-Schutzklasse, Hot-Swap-Akku; Industrie-PC</td><td>Staub, Stöße, Kälte; mobile Datenerfassung im ERP</td></tr>
<tr><td>Empfang/Kasse/Kiosk</td><td>Mini-PC oder All-in-One, Touch, ggf. Kioskmodus (Assigned Access)</td><td>platzsparend, nur eine Anwendung, Kundenkontakt</td></tr>
<tr><td>Homeoffice</td><td>Notebook + Docking + externer Monitor + Headset, VPN, MFA</td><td>flexibel, sichere Anbindung, ergonomischer Heimarbeitsplatz</td></tr>
<tr><td>Barrierefreier Arbeitsplatz</td><td>je nach Einschränkung: großer Monitor, Screenreader, Braillezeile, Spracheingabe, Spezialtastatur</td><td>Teilhabe, gesetzliche Pflicht zur Anpassung</td></tr>
<tr><td>Kleiner Server (KMU)</td><td>Server mit ECC-RAM, redundanten Netzteilen, Hot-Swap, Wartungsvertrag, USV, Backup auf NAS + Offsite/Cloud</td><td>Verfügbarkeit, Datensicherheit</td></tr></table>
<h3>Betriebssystem auswählen</h3>
<table><tr><th>Edition</th><th>Wann?</th><th>Wichtig</th></tr>
<tr><td>Windows 11 Home</td><td>Privatgeräte</td><td><b>kein</b> Domänenbeitritt, kein Entra Join, keine Gruppenrichtlinien, kein BitLocker (nur vereinfachte Geräteverschlüsselung), kein RDP-Host → <b>nicht für Firmen</b></td></tr>
<tr><td>Windows 11 Pro</td><td>Standard für KMU-Arbeitsplätze</td><td>Domäne & Entra ID Join, GPO, BitLocker, Hyper-V, Remotedesktop-Host, Intune-Verwaltung</td></tr>
<tr><td>Windows 11 Enterprise</td><td>größere Unternehmen (Volumenlizenz, z. B. in Microsoft 365 E3/E5)</td><td>zusätzlich Credential Guard, AppLocker/App Control, erweiterte Verwaltung & Sicherheit</td></tr>
<tr><td>Windows 11 Education</td><td>Schulen/Hochschulen</td><td>Enterprise-Funktionen zu Bildungspreisen</td></tr>
<tr><td>Windows 11 Enterprise LTSC / IoT</td><td>Kassen, Produktionsanlagen, medizinische Geräte</td><td>lange Supportzeit ohne Funktionsupdates, stabil</td></tr>
<tr><td>macOS</td><td>Grafik/Medien, Apple-Ökosystem</td><td>nur auf Apple-Hardware, Verwaltung per MDM</td></tr>
<tr><td>Linux (Ubuntu LTS, Debian, Fedora, RHEL)</td><td>Server, Entwickler, kostensensible oder datenschutzbewusste Umgebungen</td><td>lizenzkostenfrei (RHEL/Ubuntu Pro: Support-Abo), sicher, anpassbar; Kompatibilität mit Fachsoftware prüfen</td></tr>
<tr><td>ChromeOS / Android / iOS</td><td>einfache Web-Arbeitsplätze, Tablets, Smartphones</td><td>MDM-Verwaltung nötig</td></tr></table>
<div class="warn"><b>Windows 10</b>: Support endete am <b>14.10.2025</b>. Ohne Sicherheitsupdates ist der Betrieb ein Sicherheitsrisiko (und datenschutzrechtlich kritisch, Art. 32 DSGVO „Stand der Technik“). Lösung: Upgrade auf Windows 11 (TPM 2.0/Secure Boot prüfen), Hardware tauschen oder befristet kostenpflichtige Extended Security Updates (ESU).</div>
<p><b>Server-Betriebssysteme</b>: Windows Server <b>Essentials</b> (Kleinunternehmen, max. 25 Benutzer/50 Geräte, keine CALs nötig), <b>Standard</b> (2 VMs pro voll lizenziertem Host), <b>Datacenter</b> (unbegrenzt VMs – lohnt bei vielen VMs). Linux-Server (Ubuntu Server, Debian, RHEL) für Web, Datenbanken, Container.</p>
<h3>Microsoft-Lizenzierung – das Wichtigste</h3>
<p><b>Windows Server Standard/Datacenter: Core + CAL</b></p>
<ul><li>Lizenziert werden <b>alle physischen Kerne</b>: mindestens <b>8 Kerne pro Prozessor</b> und <b>16 Kerne pro Server</b>; verkauft in 2er- und 16er-Paketen.</li>
<li>Zusätzlich braucht jeder Zugreifende eine <b>CAL</b> (Client Access License): <b>User-CAL</b> (pro Person, egal wie viele Geräte – ideal für Mitarbeitende mit PC + Notebook + Smartphone) oder <b>Device-CAL</b> (pro Gerät, egal wie viele Personen – ideal für Schichtbetrieb/geteilte PCs). Mischen ist erlaubt.</li>
<li>Für Remotedesktop-Dienste (Terminalserver) zusätzlich <b>RDS-CALs</b>.</li></ul>
<div class="merke">Server mit 2 CPUs à 6 Kernen = 12 Kerne → trotzdem <b>16 Kern-Lizenzen</b> (Minimum). 2 CPUs à 12 Kernen = 24 Kerne → <b>24 Kern-Lizenzen</b>.<br>40 Mitarbeitende im Einschichtbetrieb mit je PC und Notebook → <b>40 User-CALs</b> (statt 80 Device-CALs). 3 Schichten × 10 Personen an 10 PCs → <b>10 Device-CALs</b> (statt 30 User-CALs).</div>
<p><b>Microsoft 365 / Office</b></p>
<table><tr><th>Plan</th><th>Inhalt (vereinfacht)</th><th>Für</th></tr>
<tr><td>Business Basic</td><td>Office im <b>Browser</b>/mobil, Exchange-Mail, Teams, OneDrive, SharePoint</td><td>Kleine Firmen, Mitarbeitende ohne Desktop-Office</td></tr>
<tr><td>Business Standard</td><td>+ <b>Desktop-Office</b>-Apps (Word, Excel, Outlook …)</td><td>Typischer Büroarbeitsplatz</td></tr>
<tr><td>Business Premium</td><td>+ <b>Intune</b> (Geräteverwaltung), <b>Entra ID P1</b> (bedingter Zugriff/MFA-Richtlinien), Defender for Business, Autopilot</td><td>KMU mit Sicherheits-/Verwaltungsanspruch</td></tr>
<tr><td>Microsoft 365 E3 / E5</td><td>Enterprise-Funktionen inkl. Windows Enterprise; E5 + erweiterte Sicherheit/Compliance</td><td>Unternehmen über 300 Nutzer</td></tr>
<tr><td>Office LTSC 2024 (Kauf)</td><td>einmalige Lizenz, Desktop-Office ohne Cloud-Dienste und ohne neue Funktionen</td><td>Offline-/Spezialumgebungen</td></tr></table>
<p>Die <b>Business-Pläne sind auf 300 Nutzer begrenzt</b>, darüber Enterprise-Pläne (E3/E5). Abrechnung pro Benutzer und Monat (Abo); ein Benutzer darf die Desktop-Apps auf bis zu 5 PCs/Macs, 5 Tablets und 5 Smartphones installieren.</p>
<h3>Lizenzmodell wählen – Entscheidungshilfe</h3>
<table><tr><th>Situation</th><th>Passendes Modell</th></tr>
<tr><td>Viele Geräte pro Person</td><td>User-basiert (User-CAL, M365 pro Benutzer)</td></tr>
<tr><td>Viele Personen pro Gerät (Schicht, Schulungsraum)</td><td>Device-basiert</td></tr>
<tr><td>Nur wenige gleichzeitig nutzen teure Spezialsoftware</td><td>Concurrent/Floating-Lizenz mit Lizenzserver</td></tr>
<tr><td>Stark schwankender Bedarf, Projekte</td><td>Abo/Pay-per-Use (monatlich kündbar)</td></tr>
<tr><td>Lange Nutzung, keine Cloud gewünscht</td><td>Kauflizenz (perpetual), ggf. mit Wartungsvertrag</td></tr>
<tr><td>Neuer PC mit vorinstalliertem OS</td><td>OEM (an Gerät gebunden)</td></tr>
<tr><td>Viele gleiche Lizenzen</td><td>Volumenlizenz/Rahmenvertrag (CSP, Enterprise Agreement)</td></tr>
<tr><td>Budget knapp, Standardaufgaben</td><td>Open Source (LibreOffice, Linux, Thunderbird, Nextcloud) – Schulungs- und Kompatibilitätsaufwand einplanen</td></tr></table>
<h3>Kauf vs. Abo (Software)</h3>
<p><b>Kauf (perpetual)</b>: einmalige Kosten, unbefristete Nutzung der Version, langfristig ggf. günstiger – aber keine neuen Funktionen, Upgrade kostet erneut, Support endet. <b>Abo/Subscription</b>: laufende planbare Kosten (OPEX), immer aktuell, Cloud-Dienste inklusive, flexibel skalierbar – aber bei Kündigung keine Nutzung mehr, langfristig oft teurer, Abhängigkeit vom Anbieter.</p>
<h3>Cloud oder On-Premises?</h3>
<table><tr><th>Kriterium</th><th>Spricht für Cloud (SaaS/IaaS)</th><th>Spricht für On-Premises</th></tr>
<tr><td>Kosten</td><td>keine Anfangsinvestition, nutzungsabhängig</td><td>langfristig planbar, keine Abo-Kosten</td></tr>
<tr><td>Personal/Know-how</td><td>wenig eigene IT</td><td>eigene IT-Abteilung vorhanden</td></tr>
<tr><td>Skalierung</td><td>schnell wachsend/schwankend</td><td>stabile Nutzerzahl</td></tr>
<tr><td>Datenschutz</td><td>EU-Rechenzentrum, AV-Vertrag</td><td>sehr sensible Daten, Berufsgeheimnis, volle Kontrolle</td></tr>
<tr><td>Internet</td><td>gute, redundante Anbindung</td><td>schlechte/unsichere Internetverbindung</td></tr></table>
<h3>Lizenzmanagement (Software Asset Management)</h3>
<p>Inventar aller Lizenzen und Installationen, regelmäßiger Abgleich. <b>Unterlizenzierung</b> = Urheberrechtsverletzung (Schadensersatz, Nachlizenzierung, Imageschaden; Hersteller dürfen Audits durchführen). <b>Überlizenzierung</b> = unnötige Kosten. Lizenznachweise aufbewahren, ausgeschiedene Nutzer zeitnah entlizenzieren.</p>
<h3>Begründungsbausteine (zum Auswendiglernen)</h3>
<ul><li>SSD: „… da sie stoßunempfindlich und schneller ist und weniger Energie verbraucht.“</li>
<li>Windows Pro: „… da nur ab der Pro-Edition der Beitritt zur Domäne/zu Entra ID sowie BitLocker möglich sind.“</li>
<li>Thin Client: „… da Anwendungen zentral laufen, die Geräte günstig, sparsam und zentral administrierbar sind und keine Daten lokal gespeichert werden.“</li>
<li>User-CAL: „… da jede Person mehrere Geräte nutzt und so weniger Lizenzen benötigt werden.“</li>
<li>Device-CAL: „… da im Schichtbetrieb mehrere Personen dasselbe Gerät nutzen.“</li>
<li>M365 Business Premium: „… da neben den Office-Apps Intune zur Geräteverwaltung und Entra ID P1 für bedingten Zugriff/MFA enthalten sind.“</li>
<li>Docking: „… da das Notebook mit einem Kabel an Monitor, Netzwerk und Peripherie angeschlossen und gleichzeitig geladen wird.“</li></ul>`,

qs:[

{t:"sc",q:"Ein Callcenter mit 60 identischen Arbeitsplätzen nutzt nur eine webbasierte CRM-Anwendung und Telefonie. Welche Hardware ist am sinnvollsten?",o:["Grafik-Workstations","Thin Clients mit Terminalserver/VDI und Headsets","Gaming-PCs","Rugged-Tablets"],a:1,e:"Zentral verwaltbar, günstig, stromsparend, keine Daten lokal."},
{t:"sc",q:"Ein Pflegedienst-Mitarbeiter arbeitet mit PC im Büro, Notebook unterwegs und Smartphone. Welche CAL-Art ist für ihn günstiger?",o:["Device-CAL","User-CAL","RDS-Device-CAL","Keine CAL"],a:1,e:"1 User-CAL statt 3 Device-CALs."},

T.push({
id:"hardware", title:"Hardware & Peripherie", icon:"🖥️", area:"Technik", weight:3,
summary:"CPU, RAM, Speicher, Schnittstellen, Monitore, Docking, Geräteklassen, Energie & Strom.",
lesson:`
<h3>Kernkomponenten</h3>
<ul><li><b>CPU</b>: Kerne (parallele Aufgaben), Threads, Takt (GHz), Cache (L1–L3, schneller Zwischenspeicher), TDP (Wärmeabgabe/Leistung). Integrierte Grafik (iGPU) reicht für Office.</li>
<li><b>RAM</b>: flüchtiger Arbeitsspeicher. Kenngrößen: Kapazität (GB), Typ (DDR4/DDR5), Takt (MT/s), Latenz (CL). <b>Dual Channel</b> = zwei gleiche Module für doppelte Bandbreite. ECC-RAM erkennt/korrigiert Fehler (Server).</li>
<li><b>Mainboard</b>: Sockel, Chipsatz, RAM-Slots, PCIe-Slots, M.2-Slots, Formfaktor (ATX, mATX, ITX), Firmware BIOS/UEFI.</li>
<li><b>Grafikkarte (GPU)</b>: dediziert für CAD, Videoschnitt, KI; VRAM; Anschluss über PCIe x16.</li>
<li><b>Netzteil</b>: Leistung (W), Wirkungsgrad (80 PLUS Bronze … Titanium), Wirkungsgrad η = P<sub>ab</sub> / P<sub>zu</sub>.</li></ul>
<h3>Massenspeicher: SSD vs. HDD</h3>
<table><tr><th></th><th>SSD (Flash)</th><th>HDD (magnetisch)</th></tr>
<tr><td>Technik</td><td>NAND-Flash, keine beweglichen Teile</td><td>rotierende Magnetscheiben, Schreib-/Lesekopf</td></tr>
<tr><td>Zugriffszeit</td><td>&lt; 0,1 ms</td><td>5–10 ms</td></tr>
<tr><td>Datenrate</td><td>SATA ~550 MB/s, NVMe PCIe 4.0 ~7.000 MB/s</td><td>~150–250 MB/s</td></tr>
<tr><td>Robustheit</td><td>stoßfest, leise, sparsam</td><td>stoßempfindlich, laut, mehr Strom</td></tr>
<tr><td>Preis/GB</td><td>höher</td><td>günstig – Archiv, große Datenmengen</td></tr>
<tr><td>Lebensdauer</td><td>begrenzte Schreibzyklen (TBW)</td><td>mechanischer Verschleiß</td></tr></table>
<p><b>Bauformen/Schnittstellen</b>: 2,5″ SATA, M.2 SATA, <b>M.2 NVMe</b> (über PCIe – am schnellsten). NVMe ist ein Protokoll, M.2 ein Formfaktor! <b>Sicheres Löschen</b>: SSD nicht per Überschreiben, sondern Secure Erase/Hersteller-Tool bzw. verschlüsselt + Schlüssel löschen.</p>
<h3>Schnittstellen</h3>
<table><tr><th>Schnittstelle</th><th>Datenrate (max.)</th><th>Hinweis</th></tr>
<tr><td>USB 2.0</td><td>480 Mbit/s</td><td>Maus, Tastatur</td></tr>
<tr><td>USB 3.2 Gen 1 (früher 3.0)</td><td>5 Gbit/s</td><td></td></tr>
<tr><td>USB 3.2 Gen 2</td><td>10 Gbit/s</td><td></td></tr>
<tr><td>USB 3.2 Gen 2x2</td><td>20 Gbit/s</td><td>nur USB-C</td></tr>
<tr><td>USB4 / Thunderbolt 4</td><td>40 Gbit/s</td><td>USB-C, Video + Daten + Strom</td></tr>
<tr><td>USB4 v2 / Thunderbolt 5</td><td>80 Gbit/s (bis 120 asymm.)</td><td>neu</td></tr>
<tr><td>HDMI 2.1</td><td>48 Gbit/s</td><td>4K@120 Hz, 8K@60 Hz, Audio</td></tr>
<tr><td>DisplayPort 1.4 / 2.1</td><td>32,4 / bis 80 Gbit/s</td><td>Daisy-Chain (MST) möglich</td></tr></table>
<div class="merke"><b>USB-C ist nur der Stecker!</b> Was er kann (Daten, Video per <b>DisplayPort Alternate Mode</b>, Laden per <b>USB Power Delivery</b> bis 100 W bzw. 240 W mit PD 3.1), hängt vom Port und Kabel ab.</div>
<p><b>Dockingstation</b>: ein Kabel (USB-C/Thunderbolt) zum Notebook → Monitore, LAN, Tastatur, Maus, Laden. Vorteile: schneller Wechsel zwischen mobil und Schreibtisch, Desk-Sharing/Clean Desk, weniger Kabelsalat, ergonomischer Arbeitsplatz mit großen Monitoren.</p>
<h3>Monitore</h3>
<p>Auflösungen: Full HD 1920×1080, WQHD 2560×1440, 4K UHD 3840×2160. Seitenverhältnis 16:9 (16:10 mehr Höhe für Office). Panel: IPS (Farbtreue, Blickwinkel – Grafik), VA (Kontrast), TN (schnell, günstig), OLED. Bildwiederholrate (Hz), Reaktionszeit (ms), Helligkeit (cd/m²), ergonomisch: höhenverstellbar, Pivot, entspiegelt, Flicker-free. Pixeldichte (ppi) = Diagonale in Pixeln ÷ Diagonale in Zoll.</p>
<h3>Geräteklassen</h3>
<ul><li><b>Desktop-PC/Workstation</b>: leistungsstark, erweiterbar, günstig je Leistung – stationär.</li>
<li><b>Notebook</b>: mobil, Akku; Business-Geräte mit Docking, TPM, Smartcard.</li>
<li><b>Thin Client</b>: minimale lokale Hardware, Anwendungen laufen zentral (Terminalserver/VDI) – sparsam, zentral administriert, sicher, aber netzabhängig.</li>
<li><b>Tablet/Smartphone</b>: mobil, Touch, MDM-Verwaltung nötig.</li>
<li><b>Mini-PC</b>: platzsparend hinter dem Monitor.</li></ul>
<h3>Strom, Leistung, Energie</h3>
<div class="merke">P = U × I (Leistung in Watt = Spannung in Volt × Strom in Ampere)<br>W = P × t (Energie in kWh = Leistung in kW × Zeit in h)<br>Kosten = Energie (kWh) × Preis (€/kWh)</div>
<p>Beispiel: PC mit 120 W, 8 h/Tag, 220 Arbeitstage, 0,35 €/kWh → 0,12 kW × 8 h × 220 = 211,2 kWh → <b>73,92 €/Jahr</b>.</p>
<p><b>USV</b> (unterbrechungsfreie Stromversorgung): überbrückt Stromausfälle (Akku), schützt vor Spannungsspitzen, ermöglicht kontrolliertes Herunterfahren. Typen: Offline (VFD), Line-Interactive (VI), Online/Doppelwandler (VFI – höchster Schutz). Dimensionierung in VA: S = P / cos φ.</p>
<h3>Kennzeichnungen & Normen</h3>
<p><b>CE</b> (Hersteller erklärt EU-Konformität), <b>Energy Star</b>, <b>EU-Energielabel</b> (Monitore A–G), <b>TCO Certified</b> (Ergonomie, Umwelt, Sozialstandards), <b>Blauer Engel</b>, <b>80 PLUS</b> (Netzteil-Effizienz), <b>GS</b> (geprüfte Sicherheit), <b>WEEE-Symbol</b> (durchgestrichene Mülltonne: nicht in den Hausmüll).</p>`,

id:"ergonomie", title:"Ergonomie & Barrierefreiheit", icon:"♿", area:"Technik", weight:2,
summary:"Bildschirmarbeitsplatz, Softwareergonomie, BFSG, WCAG, Hilfsmittel für Menschen mit Einschränkungen.",
lesson:`
<h3>Rechtsgrundlagen</h3>
<ul><li><b>Arbeitsstättenverordnung (ArbStättV)</b>, Anhang 6: Anforderungen an Bildschirmarbeitsplätze (seit 2016 integriert, ersetzt die frühere BildscharbV). Arbeitgeber muss eine <b>Gefährdungsbeurteilung</b> durchführen.</li>
<li><b>Arbeitsschutzgesetz</b>, DGUV-Informationen (z. B. DGUV Information 215-410 Bildschirm- und Büroarbeitsplätze).</li>
<li>Angebotsvorsorge Augen (ArbMedVV): Untersuchung der Augen/Sehvermögen; ggf. Bildschirmarbeitsbrille auf Kosten des Arbeitgebers.</li></ul>
<h3>Hardware-Ergonomie am Bildschirmarbeitsplatz</h3>
<table><tr><th>Element</th><th>Empfehlung</th></tr>
<tr><td>Monitor</td><td>Oberkante auf oder leicht unter Augenhöhe, Sehabstand ca. <b>50–70 cm</b> (größer bei großen Monitoren), leicht nach hinten geneigt, entspiegelt, flimmerfrei</td></tr>
<tr><td>Aufstellung</td><td>Blickrichtung <b>parallel zum Fenster</b> (Fenster seitlich), nicht davor oder dahinter → keine Blendung/Spiegelung</td></tr>
<tr><td>Tisch</td><td>höhenverstellbar (Sitz-Steh), ausreichend Fläche (mind. 160×80 cm empfohlen)</td></tr>
<tr><td>Stuhl</td><td>höhenverstellbar, Lordosenstütze, Armlehnen, 5 Rollen; Oberschenkel waagerecht, Füße flach</td></tr>
<tr><td>Tastatur/Maus</td><td>separat, flach, ggf. ergonomische/vertikale Maus; Unterarme auf Tischhöhe</td></tr>
<tr><td>Beleuchtung</td><td>ca. 500 Lux, blendfrei; Raumklima, geringe Lärmbelastung</td></tr></table>
<p>Organisatorisch: Mischarbeit/Pausen, Bewegung, Schulung zur richtigen Einstellung.</p>
<h3>Software-Ergonomie (DIN EN ISO 9241-110)</h3>
<p>Sieben Interaktionsprinzipien (Fassung 2020): <b>Aufgabenangemessenheit</b>, <b>Selbstbeschreibungsfähigkeit</b>, <b>Erwartungskonformität</b>, <b>Erlernbarkeit</b>, <b>Steuerbarkeit</b>, <b>Robustheit gegen Benutzungsfehler</b> (früher Fehlertoleranz), <b>Benutzerbindung</b> (früher Individualisierbarkeit).</p>
<div class="merke">Beispiele: Undo-Funktion = Robustheit. Tooltip/Hilfetext = Selbstbeschreibungsfähigkeit. Strg+S speichert wie in anderen Programmen = Erwartungskonformität. Nutzer bricht einen Vorgang jederzeit ab = Steuerbarkeit.</div>
<h3>Barrierefreiheit: Gesetze</h3>
<ul><li><b>BFSG – Barrierefreiheitsstärkungsgesetz</b>: setzt den European Accessibility Act um, gilt seit <b>28.06.2025</b>. Verpflichtet erstmals private Unternehmen: u. a. Computer, Notebooks, Tablets, Smartphones samt Betriebssystem, Selbstbedienungsterminals, E-Book-Reader sowie Dienstleistungen wie Onlineshops/E-Commerce, Bankdienstleistungen, Telekommunikation, E-Books. <b>Ausnahme</b>: Kleinstunternehmen (&lt; 10 Beschäftigte und ≤ 2 Mio. € Umsatz), die Dienstleistungen erbringen – für Produkte gilt die Ausnahme nicht.</li>
<li><b>BGG/BITV 2.0</b>: Barrierefreiheit für öffentliche Stellen (Bund).</li>
<li>Technischer Standard: <b>EN 301 549</b> und <b>WCAG 2.1/2.2</b> (Stufe AA).</li></ul>
<h3>WCAG – vier Prinzipien (POUR)</h3>
<table><tr><th>Prinzip</th><th>Beispiele</th></tr>
<tr><td><b>Wahrnehmbar</b> (Perceivable)</td><td>Alternativtexte für Bilder, Untertitel, ausreichender Kontrast (mind. 4,5:1), nicht nur Farbe als Info</td></tr>
<tr><td><b>Bedienbar</b> (Operable)</td><td>komplette Tastaturbedienung, sichtbarer Fokus, genug Zeit, keine Blitzeffekte</td></tr>
<tr><td><b>Verständlich</b> (Understandable)</td><td>einfache Sprache, konsistente Navigation, klare Fehlermeldungen</td></tr>
<tr><td><b>Robust</b></td><td>sauberes, semantisches HTML, kompatibel mit Screenreadern/Hilfstechnik (ARIA)</td></tr></table>
<h3>Assistive Technologien am Arbeitsplatz</h3>
<table><tr><th>Einschränkung</th><th>Lösungen</th></tr>
<tr><td>Sehbehinderung</td><td>großer/zweiter Monitor, Bildschirmlupe, hoher Kontrast, Vergrößerungssoftware</td></tr>
<tr><td>Blindheit</td><td>Screenreader (NVDA, JAWS, Windows-Sprachausgabe), Braillezeile, Sprachausgabe</td></tr>
<tr><td>Hörbehinderung</td><td>Untertitel/Live-Transkription in Meetings, visuelle Signale, Headset mit Verstärkung</td></tr>
<tr><td>Motorische Einschränkung</td><td>Spracheingabe (Mikrofon), Großtastentastatur, Einhandtastatur, Trackball, Kopf-/Augensteuerung, Sitz-Steh-Tisch</td></tr>
<tr><td>Kognitive Einschränkung</td><td>einfache Sprache, klare Struktur, Erinnerungen</td></tr></table>
<p>Förderung möglich über Integrationsamt/Inklusionsamt bzw. Agentur für Arbeit.</p>`,
cards:[

T.push({
id:"software", title:"Betriebssysteme & Software", icon:"💿", area:"Technik", weight:3,
summary:"BIOS/UEFI, Partitionierung, Dateisysteme, OS-Installation, Softwarearten, Kommandozeile.",
lesson:`
<h3>Firmware: BIOS vs. UEFI</h3>
<table><tr><th></th><th>BIOS (Legacy)</th><th>UEFI</th></tr>
<tr><td>Partitionsschema</td><td>MBR</td><td>GPT</td></tr>
<tr><td>Max. Bootlaufwerk</td><td>2 TiB</td><td>praktisch unbegrenzt (bis 9,4 ZB)</td></tr>
<tr><td>Partitionen</td><td>4 primäre (oder 3 + erweiterte)</td><td>128 (unter Windows)</td></tr>
<tr><td>Sicherheit</td><td>–</td><td><b>Secure Boot</b> (nur signierte Bootloader), TPM-Unterstützung</td></tr>
<tr><td>Bedienung</td><td>textbasiert</td><td>grafisch, Maus, Netzwerkfunktionen</td></tr></table>
<p><b>Windows 11</b> verlangt UEFI mit Secure Boot und <b>TPM 2.0</b> (Trusted Platform Module: Chip, der Schlüssel sicher speichert, z. B. für BitLocker und Windows Hello). POST = Power-On Self-Test beim Start.</p>
<h3>Partitionierung & Formatierung</h3>
<p><b>Partitionieren</b> = Datenträger in logische Bereiche aufteilen. <b>Formatieren</b> = Dateisystem anlegen. Schnellformatierung löscht nur die Verwaltungsstrukturen – Daten sind wiederherstellbar!</p>
<table><tr><th>Dateisystem</th><th>Einsatz</th><th>Merkmale</th></tr>
<tr><td>FAT32</td><td>USB-Sticks, kompatibel überall</td><td>max. Dateigröße <b>4 GiB</b>, keine Rechte</td></tr>
<tr><td>exFAT</td><td>große USB-Sticks/SD-Karten</td><td>große Dateien, plattformübergreifend, keine Rechte/Journal</td></tr>
<tr><td>NTFS</td><td>Windows-Systempartition</td><td>Rechte (ACL), Journaling, Verschlüsselung (EFS), Kompression, Quotas</td></tr>
<tr><td>ReFS</td><td>Windows Server</td><td>Integritätsprüfung, große Volumes</td></tr>
<tr><td>ext4 / Btrfs / XFS</td><td>Linux</td><td>Journaling, Unix-Rechte</td></tr>
<tr><td>APFS</td><td>macOS</td><td>Snapshots, Verschlüsselung</td></tr></table>
<p><b>Journaling</b>: Änderungen werden protokolliert, bevor sie ausgeführt werden → nach Absturz schnell konsistent.</p>
<h3>Betriebssystem einrichten (Ablauf)</h3>
<ol><li>Hardwareanforderungen prüfen, Firmware-Update, UEFI-Einstellungen (Secure Boot, TPM, Bootreihenfolge).</li>
<li>Installation: manuell vom USB-Stick, <b>Image</b> (geklontes Systemabbild), Netzwerkinstallation (PXE/WDS) oder <b>Windows Autopilot</b> (cloudbasiert über Intune).</li>
<li>Treiber, Updates, Anwendungen, Sprachpakete.</li>
<li>Netzwerk: IP per DHCP oder statisch, Domänenbeitritt / Entra Join.</li>
<li>Härtung: Admin-Rechte entziehen, Firewall, Virenschutz, BitLocker, unnötige Dienste deaktivieren.</li>
<li>Test & Dokumentation (Inventarnummer, Seriennummer, Konfiguration), Übergabe an Nutzer.</li></ol>
<p><b>Installationsarten</b>: Neuinstallation (clean), Upgrade (Daten bleiben), unbeaufsichtigte Installation (Antwortdatei unattend.xml), Imaging (identische Systeme schnell verteilen), Softwareverteilung (Intune, SCCM, winget).</p>
<h3>Softwarearten</h3>
<ul><li><b>Systemsoftware</b> (Betriebssystem, Treiber, Firmware) vs. <b>Anwendungssoftware</b> (Office, ERP, Browser).</li>
<li><b>Standardsoftware</b> (für viele Kunden, günstig, sofort verfügbar, getestet – aber evtl. nicht passgenau) vs. <b>Individualsoftware</b> (maßgeschneidert, passgenau, Wettbewerbsvorteil – aber teuer, lange Entwicklungszeit, Abhängigkeit vom Entwickler).</li>
<li><b>Branchensoftware</b>: für eine Branche angepasste Standardsoftware (z. B. Arztpraxis-, Kanzleisoftware).</li>
<li><b>Open Source vs. proprietär</b>: siehe Lizenzen. Open Source: keine Lizenzkosten, anpassbar, Community – aber Support evtl. kostenpflichtig, Know-how nötig.</li>
<li>Auswahlkriterien: Funktionsumfang, Kompatibilität/<b>Interoperabilität</b>, Schnittstellen (API), Anpassbarkeit, Wartbarkeit, Ergonomie, Kosten/Lizenzmodell, Support, Datenschutz (Serverstandort).</li></ul>
<h3>Kommandozeile – wichtige Befehle</h3>
<table><tr><th>Zweck</th><th>Windows (CMD/PowerShell)</th><th>Linux</th></tr>
<tr><td>Verzeichnis anzeigen</td><td>dir / Get-ChildItem</td><td>ls -l</td></tr>
<tr><td>Verzeichnis wechseln / erstellen</td><td>cd / mkdir</td><td>cd / mkdir</td></tr>
<tr><td>Datei kopieren / verschieben / löschen</td><td>copy / move / del</td><td>cp / mv / rm</td></tr>
<tr><td>IP-Konfiguration</td><td>ipconfig /all</td><td>ip a (iproute2), alt: ifconfig</td></tr>
<tr><td>Erreichbarkeit</td><td>ping</td><td>ping</td></tr>
<tr><td>Route verfolgen</td><td>tracert</td><td>traceroute</td></tr>
<tr><td>DNS abfragen</td><td>nslookup</td><td>nslookup, dig</td></tr>
<tr><td>ARP-Tabelle</td><td>arp -a</td><td>ip neigh / arp</td></tr>
<tr><td>Offene Verbindungen</td><td>netstat -an</td><td>ss -tulpn</td></tr>
<tr><td>DHCP erneuern</td><td>ipconfig /release, /renew</td><td>dhclient</td></tr>
<tr><td>DNS-Cache leeren</td><td>ipconfig /flushdns</td><td>resolvectl flush-caches</td></tr>
<tr><td>Rechte ändern</td><td>icacls</td><td>chmod, chown</td></tr>
<tr><td>Gruppenrichtlinien anwenden</td><td>gpupdate /force</td><td>–</td></tr>
<tr><td>Aliasse</td><td>Set-Alias</td><td>alias ll='ls -l'</td></tr></table>
<h3>Linux-Rechte mit chmod</h3>
<p>Drei Gruppen: <b>u</b>ser (Besitzer), <b>g</b>roup, <b>o</b>thers. Rechte: r = 4, w = 2, x = 1.</p>
<div class="merke"><code>chmod 754 skript.sh</code> → Besitzer 7 = rwx, Gruppe 5 = r-x, Andere 4 = r--.<br><code>ls -l</code> zeigt z. B. <code>-rwxr-x---</code> = 750.</div>`,

T.push({
id:"cloud", title:"Cloud, Virtualisierung, ERP & KI", icon:"☁️", area:"Technik", weight:3,
summary:"IaaS/PaaS/SaaS, Bereitstellungsmodelle, Hypervisor, Container, ERP/CRM/SCM, KI am Arbeitsplatz.",
lesson:`
<h3>Cloud Computing – Servicemodelle</h3>
<table><tr><th>Modell</th><th>Anbieter stellt</th><th>Kunde verwaltet</th><th>Beispiele</th></tr>
<tr><td><b>IaaS</b></td><td>Server, Speicher, Netzwerk (virtuell)</td><td>Betriebssystem, Middleware, Apps, Daten</td><td>Azure VMs, AWS EC2</td></tr>
<tr><td><b>PaaS</b></td><td>+ Betriebssystem, Laufzeitumgebung, Datenbank</td><td>Anwendungen & Daten</td><td>Azure App Service, Heroku</td></tr>
<tr><td><b>SaaS</b></td><td>komplette Anwendung</td><td>nur Nutzung/Daten, Konfiguration</td><td>Microsoft 365, Salesforce, Teams</td></tr></table>
<div class="merke"><b>Shared Responsibility:</b> Je weiter Richtung SaaS, desto mehr Verantwortung trägt der Anbieter. Für Daten, Identitäten und Zugriffe bleibt immer der Kunde verantwortlich.</div>
<h3>Bereitstellungsmodelle</h3>
<ul><li><b>Public Cloud</b>: Ressourcen vieler Kunden auf Infrastruktur eines Anbieters – günstig, skalierbar.</li>
<li><b>Private Cloud</b>: exklusiv für eine Organisation (eigenes RZ oder gehostet) – Kontrolle, Datenschutz, teurer.</li>
<li><b>Hybrid Cloud</b>: Kombination – z. B. sensible Daten privat, Lastspitzen public.</li>
<li><b>Community Cloud</b>: mehrere Organisationen mit gleichen Anforderungen (z. B. Behörden).</li></ul>
<p><b>Merkmale (NIST)</b>: On-Demand-Self-Service, breiter Netzwerkzugriff, Ressourcen-Pooling, schnelle Elastizität, messbare Nutzung (Pay-per-Use).<br>
<b>Vorteile</b>: keine Investitionskosten (OPEX statt CAPEX), Skalierbarkeit, ortsunabhängig, hohe Verfügbarkeit, Updates durch Anbieter. <b>Nachteile/Risiken</b>: Internetabhängigkeit, Datenschutz (Serverstandort, <b>Drittland</b>-Übermittlung, AV-Vertrag nach Art. 28 DSGVO), Vendor-Lock-in, laufende Kosten, weniger Kontrolle.</p>
<h3>Virtualisierung</h3>
<ul><li><b>Hypervisor Typ 1 (Bare Metal)</b>: läuft direkt auf der Hardware – Hyper-V, VMware ESXi, Proxmox/KVM. Server/Rechenzentrum, performant.</li>
<li><b>Hypervisor Typ 2 (Hosted)</b>: läuft als Anwendung auf einem Host-OS – VirtualBox, VMware Workstation. Test/Entwicklung.</li>
<li><b>Vorteile</b>: bessere Auslastung, weniger Hardware/Strom/Platz (Green IT), Snapshots, schnelle Bereitstellung, Isolation, Live-Migration, einfache Testumgebungen.</li>
<li><b>Nachteile</b>: Host als Single Point of Failure, Overhead, Lizenzkosten, Know-how.</li></ul>
<p><b>Container</b> (Docker): teilen sich den Kernel des Host-OS, enthalten nur App + Abhängigkeiten → leichtgewichtig, starten in Sekunden, portabel. VMs enthalten ein vollständiges Gast-OS → stärkere Isolation.</p>
<p><b>Desktop-Virtualisierung (VDI)</b>: Desktops laufen zentral im Rechenzentrum, Zugriff über Thin Client oder beliebige Geräte (z. B. Azure Virtual Desktop, Windows 365).</p>
<h3>Unternehmenssoftware</h3>
<table><tr><th>System</th><th>Zweck</th><th>Typische Funktionen</th></tr>
<tr><td><b>ERP</b> – Enterprise Resource Planning</td><td>integrierte Steuerung aller Unternehmensressourcen mit zentraler Datenbank</td><td>Finanzbuchhaltung, Einkauf, Lager/Materialwirtschaft, Produktion, Vertrieb, Personal (z. B. SAP S/4HANA, Microsoft Dynamics 365)</td></tr>
<tr><td><b>CRM</b> – Customer Relationship Management</td><td>Kundenbeziehungen pflegen</td><td>Kontakthistorie, Leads, Angebote, Kampagnen, Service-Tickets (z. B. Salesforce, HubSpot)</td></tr>
<tr><td><b>SCM</b> – Supply Chain Management</td><td>Lieferkette steuern</td><td>Beschaffung, Lieferanten, Logistik, Bestandsoptimierung, Just-in-Time</td></tr></table>
<p>Weitere: DMS (Dokumentenmanagement), HR-Software, BI (Business Intelligence), Groupware (E-Mail, Kalender – Exchange/Outlook), Kollaboration (Teams, SharePoint).<br><b>Stammdaten</b> (selten geändert: Kunden, Artikel) vs. <b>Bewegungsdaten</b> (laufend: Bestellungen, Rechnungen).</p>
<h3>KI-Software am Arbeitsplatz</h3>
<ul><li><b>Einsatz</b>: Texte entwerfen/zusammenfassen, Übersetzen, Programmieren (Code-Assistenten), Meeting-Protokolle, Datenanalyse, Chatbots im Support, Bilderkennung. Beispiele: Microsoft 365 Copilot, ChatGPT, Claude, GitHub Copilot.</li>
<li><b>Generative KI / LLM</b> (Large Language Model): erzeugt Inhalte auf Basis statistischer Muster aus Trainingsdaten; <b>Prompt</b> = Eingabe/Anweisung.</li>
<li><b>Risiken</b>: <b>Halluzinationen</b> (plausibel klingende Falschaussagen) → Ergebnisse immer prüfen; Datenschutz/Geschäftsgeheimnisse (keine personenbezogenen oder vertraulichen Daten in öffentliche KI-Dienste); Urheberrecht; Bias (Verzerrungen); Abhängigkeit.</li>
<li><b>Maßnahmen</b>: KI-Richtlinie im Unternehmen, freigegebene Tools mit Enterprise-Datenschutz (keine Nutzung der Daten zum Training), Schulung, menschliche Kontrolle („Human in the Loop“), Kennzeichnung KI-generierter Inhalte.</li>
<li><b>EU AI Act (KI-Verordnung)</b>: risikobasiert (unannehmbar = verboten, hoch, begrenzt/Transparenzpflicht, minimal). Seit 02.02.2025 gelten Verbote bestimmter Praktiken und Art. 4 <b>KI-Kompetenz</b>: Unternehmen müssen Maßnahmen ergreifen, damit Beschäftigte, die KI nutzen, ausreichend geschult sind.</li></ul>`,
cards:[

id:"netzwerk", title:"Netzwerk-Grundlagen", icon:"🌐", area:"Netzwerk", weight:3,
summary:"OSI & TCP/IP, Geräte, Topologien, Kabel & LWL, Ethernet, WLAN-Standards & -Sicherheit, PoE, VLAN.",
lesson:`
<h3>OSI-Modell und TCP/IP</h3>
<table><tr><th>Nr.</th><th>OSI-Schicht</th><th>TCP/IP</th><th>Einheit</th><th>Beispiele / Geräte</th></tr>
<tr><td>7</td><td>Anwendung (Application)</td><td rowspan="3">Anwendung</td><td rowspan="3">Daten</td><td>HTTP(S), DNS, SMTP, FTP, SSH, DHCP</td></tr>
<tr><td>6</td><td>Darstellung (Presentation)</td><td>Kodierung, Verschlüsselung (TLS), Kompression</td></tr>
<tr><td>5</td><td>Sitzung (Session)</td><td>Sitzungssteuerung</td></tr>
<tr><td>4</td><td>Transport</td><td>Transport</td><td>Segment</td><td>TCP, UDP, Ports</td></tr>
<tr><td>3</td><td>Vermittlung (Network)</td><td>Internet</td><td>Paket</td><td>IP, ICMP – <b>Router</b>, Layer-3-Switch</td></tr>
<tr><td>2</td><td>Sicherung (Data Link)</td><td rowspan="2">Netzzugang</td><td>Frame</td><td>Ethernet, MAC, ARP – <b>Switch</b>, Bridge, Access Point</td></tr>
<tr><td>1</td><td>Bitübertragung (Physical)</td><td>Bit</td><td>Kabel, Stecker, Funk – Hub, Repeater, Medienkonverter</td></tr></table>
<div class="tip">Eselsbrücke (7→1): „<b>A</b>lle <b>D</b>eutschen <b>S</b>chüler <b>T</b>rinken <b>V</b>erschiedene <b>S</b>orten <b>B</b>ier“.</div>
<h3>Netzwerkgeräte</h3>
<ul><li><b>Hub</b> (L1): sendet an alle Ports – veraltet, Kollisionen.</li>
<li><b>Switch</b> (L2): verbindet Geräte im selben Netz, leitet Frames anhand der <b>MAC-Adresstabelle</b> (SAT) gezielt weiter. Managed Switch: VLANs, Monitoring, PoE.</li>
<li><b>Router</b> (L3): verbindet <b>unterschiedliche Netze</b> (LAN ↔ Internet), entscheidet anhand der <b>IP-Adresse</b> und Routingtabelle; oft mit NAT, Firewall, DHCP.</li>
<li><b>Access Point</b>: bindet WLAN-Clients ins kabelgebundene Netz ein. <b>WLAN-Controller</b> verwaltet viele APs zentral.</li>
<li><b>Firewall</b>: filtert Datenverkehr nach Regeln. <b>Modem</b>: wandelt Signale (DSL, Kabel, Glasfaser-ONT).</li></ul>
<h3>Topologien</h3>
<table><tr><th>Topologie</th><th>Vorteil</th><th>Nachteil</th></tr>
<tr><td><b>Stern</b> (heute Standard)</td><td>Ausfall eines Endgeräts/Kabels betrifft nur dieses, leicht erweiterbar</td><td>zentraler Switch = Single Point of Failure, viel Kabel</td></tr>
<tr><td>Bus</td><td>wenig Kabel, günstig</td><td>Kabelbruch legt alles lahm, Kollisionen</td></tr>
<tr><td>Ring</td><td>gleichberechtigter Zugriff</td><td>Ausfall eines Knotens unterbricht Ring (außer Doppelring)</td></tr>
<tr><td>Baum (erweiterter Stern)</td><td>hierarchisch, gut strukturierbar</td><td>Ausfall eines Verteilers trennt Teilbaum</td></tr>
<tr><td>Vermascht (voll/teil)</td><td>hohe Ausfallsicherheit, redundante Wege</td><td>teuer, viel Kabel; voll: n·(n−1)/2 Verbindungen</td></tr></table>
<h3>Übertragungsmedien</h3>
<ul><li><b>Twisted Pair (Kupfer)</b>, RJ45, max. <b>100 m</b> pro Segment. Cat 5e: 1 Gbit/s; Cat 6: 1 Gbit/s (10 Gbit/s bis 55 m); <b>Cat 6A: 10 Gbit/s</b> bis 100 m; Cat 7/7A; Cat 8: 25/40 Gbit/s bis 30 m. Schirmung: U/UTP (ungeschirmt), F/UTP, S/FTP (Gesamt- + Paarschirm).</li>
<li><b>Lichtwellenleiter (LWL/Glasfaser)</b>: Multimode (OM3/OM4, kurze Strecken, Gebäude) und Singlemode (OS2, km-weit). Vorteile: hohe Reichweite & Bandbreite, unempfindlich gegen elektromagnetische Störungen, abhörsicherer, galvanische Trennung. Nachteile: teurer, empfindlich beim Verlegen (Biegeradius), Spleißen aufwendig.</li></ul>
<p><b>Ethernet-Standards</b> (IEEE 802.3): 100BASE-TX (100 Mbit/s), 1000BASE-T (1 Gbit/s), 2.5G/5GBASE-T (NBASE-T, für WLAN-APs), 10GBASE-T (10 Gbit/s, Cat 6A). Strukturierte Verkabelung: Primär (Gelände, LWL), Sekundär (Gebäude/Steigbereich, LWL), Tertiär (Etage, Kupfer zur Dose).</p>
<h3>PoE – Power over Ethernet</h3>
<p>Strom und Daten über ein Netzwerkkabel – für Access Points, IP-Telefone, Kameras. Kein Netzteil/Steckdose am Gerät nötig, zentrale USV-Absicherung möglich.</p>
<table><tr><th>Standard</th><th>Leistung am PSE (Switch)</th></tr>
<tr><td>802.3af (PoE)</td><td>15,4 W</td></tr><tr><td>802.3at (PoE+)</td><td>30 W</td></tr><tr><td>802.3bt Typ 3 / Typ 4 (PoE++)</td><td>60 W / 90–100 W</td></tr></table>
<h3>WLAN-Standards (IEEE 802.11)</h3>
<table><tr><th>Bezeichnung</th><th>Standard</th><th>Frequenz</th><th>max. brutto</th></tr>
<tr><td>Wi-Fi 4</td><td>802.11n</td><td>2,4 / 5 GHz</td><td>600 Mbit/s</td></tr>
<tr><td>Wi-Fi 5</td><td>802.11ac</td><td>5 GHz</td><td>6,9 Gbit/s</td></tr>
<tr><td>Wi-Fi 6 / 6E</td><td>802.11ax</td><td>2,4 / 5 (/ 6) GHz</td><td>9,6 Gbit/s</td></tr>
<tr><td>Wi-Fi 7</td><td>802.11be</td><td>2,4 / 5 / 6 GHz</td><td>~46 Gbit/s</td></tr></table>
<p>2,4 GHz: größere Reichweite, durchdringt Wände besser, aber nur 3 überlappungsfreie Kanäle (1, 6, 11) und viele Störquellen. 5/6 GHz: mehr Kanäle, höhere Datenraten, geringere Reichweite. WLAN ist <b>Halbduplex</b> – alle teilen sich das Medium; Nettodatenrate deutlich unter brutto.</p>
<h3>WLAN-Sicherheit</h3>
<ul><li>WEP und WPA (TKIP): unsicher – nicht mehr verwenden.</li>
<li><b>WPA2</b> (AES-CCMP) – Mindeststandard. <b>WPA3</b>: SAE statt PSK-Handshake (Schutz gegen Offline-Wörterbuchangriffe), Forward Secrecy, 192-Bit-Modus für Enterprise.</li>
<li><b>Personal (PSK)</b>: ein gemeinsames Passwort für alle – einfach, aber bei Ausscheiden eines Mitarbeiters muss es überall geändert werden.</li>
<li><b>Enterprise (IEEE 802.1X)</b>: individuelle Anmeldung (Benutzername/Passwort oder Zertifikat) über einen <b>RADIUS-Server</b> – Nutzer einzeln sperrbar, nachvollziehbar, ideal für Firmen.</li>
<li>Weitere Maßnahmen: Gast-WLAN in eigenem VLAN, starke Passphrase, Firmware-Updates, WPS deaktivieren. (SSID-Verstecken und MAC-Filter sind keine echte Sicherheit.)</li></ul>
<h3>VLAN</h3>
<p>Ein <b>Virtual LAN</b> teilt einen physischen Switch logisch in getrennte Netze (Broadcast-Domänen), z. B. Verwaltung, Produktion, Gäste, VoIP. Vorteile: Sicherheit durch Trennung, weniger Broadcast-Last, flexible Zuordnung unabhängig vom Standort. Kommunikation zwischen VLANs nur über Router/Layer-3-Switch. <b>IEEE 802.1Q</b>: Tagging auf Trunk-Ports.</p>
<h3>Übertragungsarten</h3>
<p><b>Simplex</b> (eine Richtung), <b>Halbduplex</b> (abwechselnd, z. B. WLAN, Funkgerät), <b>Vollduplex</b> (gleichzeitig beide Richtungen, z. B. Switch-Port). <b>Unicast</b> (1:1), <b>Multicast</b> (1:Gruppe), <b>Broadcast</b> (1:alle im Netz).</p>`,
