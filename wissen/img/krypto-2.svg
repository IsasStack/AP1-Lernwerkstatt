<svg xmlns="http://www.w3.org/2000/svg" width="720" height="272" font-family="Inter,Arial,sans-serif" font-size="12" viewBox="0 0 720 272" role="img" aria-label="Ablauf der digitalen Signatur"><rect x="0" y="0" width="100%" height="100%" fill="#0f141b"/><defs><marker id="kr-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#93a1b3"/></marker></defs><text x="170" y="18" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Absender A</text><text x="550" y="18" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">Empfänger B</text><rect x="90" y="30" width="160" height="34" rx="7" fill="#1b2430" stroke="#93a1b3" stroke-width="1.5"/><text x="170.0" y="49" fill="#d7dee8" font-size="11.5" font-weight="700" text-anchor="middle">Dokument</text><rect x="90" y="100" width="160" height="46" rx="7" fill="#1b2430" stroke="#38bdf8" stroke-width="1.5"/><text x="170.0" y="119" fill="#d7dee8" font-size="11.5" font-weight="700" text-anchor="middle">Hashwert bilden</text><text x="170.0" y="135" fill="#93a1b3" font-size="10" font-weight="400" text-anchor="middle">z. B. SHA-256</text><rect x="90" y="180" width="160" height="46" rx="7" fill="#1b2430" stroke="#38bdf8" stroke-width="1.5"/><text x="170.0" y="199" fill="#d7dee8" font-size="11.5" font-weight="700" text-anchor="middle">Hash verschlüsseln</text><text x="170.0" y="215" fill="#93a1b3" font-size="10" font-weight="400" text-anchor="middle">privater Schlüssel A</text><line x1="170" y1="64" x2="170" y2="98" stroke="#93a1b3" stroke-width="1.6" marker-end="url(#kr-a)"/><line x1="170" y1="146" x2="170" y2="178" stroke="#93a1b3" stroke-width="1.6" marker-end="url(#kr-a)"/><text x="170" y="252" fill="#93a1b3" font-size="10.5" font-weight="400" text-anchor="middle">= Signatur, wird mit dem Dokument gesendet</text><rect x="440" y="30" width="220" height="34" rx="7" fill="#1b2430" stroke="#fbbf24" stroke-width="1.5"/><text x="550.0" y="49" fill="#d7dee8" font-size="11.5" font-weight="700" text-anchor="middle">erhält Dokument + Signatur</text><rect x="395" y="100" width="150" height="46" rx="7" fill="#1b2430" stroke="#fbbf24" stroke-width="1.5"/><text x="470.0" y="119" fill="#d7dee8" font-size="11.5" font-weight="700" text-anchor="middle">Hash selbst bilden</text><text x="470.0" y="135" fill="#93a1b3" font-size="10" font-weight="400" text-anchor="middle">aus dem Dokument</text><rect x="555" y="100" width="150" height="46" rx="7" fill="#1b2430" stroke="#fbbf24" stroke-width="1.5"/><text x="630.0" y="119" fill="#d7dee8" font-size="11.5" font-weight="700" text-anchor="middle">Signatur entschlüsseln</text><text x="630.0" y="135" fill="#93a1b3" font-size="10" font-weight="400" text-anchor="middle">öffentl. Schlüssel A</text><rect x="470" y="190" width="160" height="34" rx="7" fill="#1b2430" stroke="#34d399" stroke-width="1.5"/><text x="550.0" y="209" fill="#d7dee8" font-size="11.5" font-weight="700" text-anchor="middle">Hashwerte gleich?</text><line x1="250" y1="47" x2="438" y2="47" stroke="#93a1b3" stroke-width="1.6" marker-end="url(#kr-a)"/><text x="344.0" y="40.0" fill="#93a1b3" font-size="10.5" font-weight="400" text-anchor="middle">senden</text><line x1="500" y1="64" x2="470" y2="98" stroke="#93a1b3" stroke-width="1.6" marker-end="url(#kr-a)"/><line x1="600" y1="64" x2="630" y2="98" stroke="#93a1b3" stroke-width="1.6" marker-end="url(#kr-a)"/><line x1="470" y1="146" x2="520" y2="188" stroke="#93a1b3" stroke-width="1.6" marker-end="url(#kr-a)"/><line x1="630" y1="146" x2="580" y2="188" stroke="#93a1b3" stroke-width="1.6" marker-end="url(#kr-a)"/><text x="550" y="248" fill="#34d399" font-size="10.5" font-weight="400" text-anchor="middle">ja → unverändert (Integrität)</text><text x="550" y="263" fill="#34d399" font-size="10.5" font-weight="400" text-anchor="middle">und wirklich von A (Authentizität)</text></svg>