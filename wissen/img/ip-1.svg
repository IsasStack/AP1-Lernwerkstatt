<svg xmlns="http://www.w3.org/2000/svg" width="600" height="238" font-family="Inter,Arial,sans-serif" font-size="12" viewBox="0 0 600 238" role="img" aria-label="DHCP-Ablauf DORA"><rect x="0" y="0" width="100%" height="100%" fill="#0f141b"/><defs><marker id="sq-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#93a1b3"/></marker></defs><text x="110" y="20" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Client</text><text x="490" y="20" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">DHCP-Server</text><line x1="110" y1="30" x2="110" y2="232" stroke="#334255" stroke-width="2"/><line x1="490" y1="30" x2="490" y2="232" stroke="#334255" stroke-width="2"/><line x1="113" y1="60" x2="487" y2="60" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#sq-a)"/><text x="300.0" y="53" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">1. Discover</text><text x="300.0" y="75" fill="#93a1b3" font-size="10.5" font-weight="400" text-anchor="middle">Broadcast: „Gibt es einen DHCP-Server?“</text><line x1="487" y1="108" x2="113" y2="108" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#sq-a)"/><text x="300.0" y="101" fill="#fbbf24" font-size="11.5" font-weight="700" text-anchor="middle">2. Offer</text><text x="300.0" y="123" fill="#93a1b3" font-size="10.5" font-weight="400" text-anchor="middle">„Du kannst 192.168.10.123 haben.“</text><line x1="113" y1="156" x2="487" y2="156" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#sq-a)"/><text x="300.0" y="149" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">3. Request</text><text x="300.0" y="171" fill="#93a1b3" font-size="10.5" font-weight="400" text-anchor="middle">„Ich nehme 192.168.10.123.“</text><line x1="487" y1="204" x2="113" y2="204" stroke="#34d399" stroke-width="1.8" marker-end="url(#sq-a)"/><text x="300.0" y="197" fill="#34d399" font-size="11.5" font-weight="700" text-anchor="middle">4. Acknowledge</text><text x="300.0" y="219" fill="#93a1b3" font-size="10.5" font-weight="400" text-anchor="middle">Bestätigung + Maske, Gateway, DNS, Lease-Dauer</text></svg>