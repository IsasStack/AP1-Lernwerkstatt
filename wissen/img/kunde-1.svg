<svg xmlns="http://www.w3.org/2000/svg" width="670" height="162" font-family="Inter,Arial,sans-serif" font-size="12" viewBox="0 0 670 162" role="img" aria-label="Sender-Empfänger-Modell"><rect x="0" y="0" width="100%" height="100%" fill="#0f141b"/><defs><marker id="se-ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#93a1b3"/></marker></defs><rect x="10" y="30" width="150" height="62" rx="8" fill="#1b2430" stroke="#38bdf8" stroke-width="1.5"/><text x="85.0" y="56" fill="#d7dee8" font-size="12" font-weight="700" text-anchor="middle">Sender</text><text x="85.0" y="76" fill="#93a1b3" font-size="11" font-weight="400" text-anchor="middle">codiert die Nachricht</text><rect x="250" y="30" width="170" height="62" rx="8" fill="#1b2430" stroke="#93a1b3" stroke-width="1.5"/><text x="335.0" y="56" fill="#d7dee8" font-size="12" font-weight="700" text-anchor="middle">Kanal</text><text x="335.0" y="76" fill="#93a1b3" font-size="11" font-weight="400" text-anchor="middle">Gespräch, Mail, Telefon</text><rect x="510" y="30" width="150" height="62" rx="8" fill="#1b2430" stroke="#34d399" stroke-width="1.5"/><text x="585.0" y="56" fill="#d7dee8" font-size="12" font-weight="700" text-anchor="middle">Empfänger</text><text x="585.0" y="76" fill="#93a1b3" font-size="11" font-weight="400" text-anchor="middle">decodiert die Nachricht</text><line x1="160" y1="61" x2="246" y2="61" stroke="#93a1b3" stroke-width="1.5" marker-end="url(#se-ar)"/><line x1="420" y1="61" x2="506" y2="61" stroke="#93a1b3" stroke-width="1.5" marker-end="url(#se-ar)"/><path d="M585,92 C585,140 85,140 85,96" fill="none" stroke="#93a1b3" stroke-dasharray="5 4" marker-end="url(#se-ar)"/><text x="335" y="152" fill="#93a1b3" font-size="11" font-weight="400" text-anchor="middle">Rückmeldung (Feedback)</text><path d="M335,4 L335,26" stroke="#f87171" stroke-width="1.5" marker-end="url(#se-ar)"/><text x="345" y="14" fill="#f87171" font-size="11" font-weight="400" text-anchor