<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" font-family="Inter,Arial,sans-serif" font-size="12" viewBox="0 0 720 228" role="img" aria-label="Symmetrische und asymmetrische Verschlüsselung im Vergleich"><rect x="0" y="0" width="100%" height="100%" fill="#0f141b"/><defs><marker id="kr-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#93a1b3"/></marker></defs><text x="10" y="18" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="start">Symmetrisch – ein gemeinsamer Schlüssel</text><rect x="10" y="30" width="120" height="34" rx="7" fill="#1b2430" stroke="#93a1b3" stroke-width="1.5"/><text x="70.0" y="49" fill="#d7dee8" font-size="11.5" font-weight="700" text-anchor="middle">Klartext</text><rect x="200" y="30" width="130" height="46" rx="7" fill="#1b2430" stroke="#38bdf8" stroke-width="1.5"/><text x="265.0" y="49" fill="#d7dee8" font-size="11.5" font-weight="700" text-anchor="middle">verschlüsseln</text><text x="265.0" y="65" fill="#93a1b3" font-size="10" font-weight="400" text-anchor="middle">🔑 Schlüssel K</text><rect x="400" y="30" width="110" height="34" rx="7" fill="#1b2430" stroke="#93a1b3" stroke-width="1.5"/><text x="455.0" y="49" fill="#d7dee8" font-size="11.5" font-weight="700" text-anchor="middle">Geheimtext</text><rect x="580" y="30" width="130" height="46" rx="7" fill="#1b2430" stroke="#38bdf8" stroke-width="1.5"/><text x="645.0" y="49" fill="#d7dee8" font-size="11.5" font-weight="700" text-anchor="middle">entschlüsseln</text><text x="645.0" y="65" fill="#93a1b3" font-size="10" font-weight="400" text-anchor="middle">🔑 derselbe K</text><line x1="130" y1="47" x2="198" y2="47" stroke="#93a1b3" stroke-width="1.6" marker-end="url(#kr-a)"/><line x1="330" y1="53" x2="398" y2="47" stroke="#93a1b3" stroke-width="1.6" marker-end="url(#kr-a)"/><line x1="510" y1="47" x2="578" y2="53" stroke="#93a1b3" stroke-width="1.6" marker-end="url(#kr-a)"/><text x="360" y="98" fill="#f87171" font-size="11" font-weight="400" text-anchor="middle">Problem: Wie bekommt der Empfänger den Schlüssel K sicher?</text><text x="10" y="138" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="start">Asymmetrisch – Schlüsselpaar des Empfängers</text><rect x="10" y="150" width="120" height="34" rx="7" fill="#1b2430" stroke="#93a1b3" stroke-width="1.5"/><text x="70.0" y="169" fill="#d7dee8" font-size="11.5" font-weight="700" text-anchor="middle">Klartext</text><rect x="200" y="150" width="130" height="46" rx="7" fill="#1b2430" stroke="#fbbf24" stroke-width="1.5"/><text x="265.0" y="169" fill="#d7dee8" font-size="11.5" font-weight="700" text-anchor="middle">verschlüsseln</text><text x="265.0" y="185" fill="#93a1b3" font-size="10" font-weight="400" text-anchor="middle">öffentl. Schlüssel B</text><rect x="400" y="150" width="110" height="34" rx="7" fill="#1b2430" stroke="#93a1b3" stroke-width="1.5"/><text x="455.0" y="169" fill="#d7dee8" font-size="11.5" font-weight="700" text-anchor="middle">Geheimtext</text><rect x="580" y="150" width="130" height="46" rx="7" fill="#1b2430" stroke="#34d399" stroke-width="1.5"/><text x="645.0" y="169" fill="#d7dee8" font-size="11.5" font-weight="700" text-anchor="middle">entschlüsseln</text><text x="645.0" y="185" fill="#93a1b3" font-size="10" font-weight="400" text-anchor="middle">privater Schlüssel B</text><line x1="130" y1="167" x2="198" y2="167" stroke="#93a1b3" stroke-width="1.6" marker-end="url(#kr-a)"/><line x1="330" y1="173" x2="398" y2="167" stroke="#93a1b3" stroke-width="1.6" marker-end="url(#kr-a)"/><line x1="510" y1="167" x2="578" y2="173" stroke="#93a1b3" stroke-width="1.6" marker-end="url(#kr-a)"/><text x="360" y="218" fill="#34d399" font-size="11" font-weight="400" text-anchor="middle">Den öffentlichen Schlüssel darf jeder kennen – entschlüsseln kann nur, wer den privaten hat.</text></svg>