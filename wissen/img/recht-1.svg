<svg xmlns="http://www.w3.org/2000/svg" width="640" height="296" font-family="Inter,Arial,sans-serif" font-size="12" viewBox="0 0 640 296" role="img" aria-label="Ablauf vom Angebot zum Vertrag"><rect x="0" y="0" width="100%" height="100%" fill="#0f141b"/><defs><marker id="vt-ar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#93a1b3"/></marker></defs><text x="110" y="20" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Kunde</text><text x="530" y="20" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">Lieferant</text><line x1="110" y1="30" x2="110" y2="290" stroke="#334255" stroke-width="2"/><line x1="530" y1="30" x2="530" y2="290" stroke="#334255" stroke-width="2"/><line x1="114" y1="60" x2="524" y2="60" stroke="#93a1b3" stroke-width="1.8" marker-end="url(#vt-ar)"/><text x="320" y="52" fill="#93a1b3" font-size="12" font-weight="700" text-anchor="middle">Anfrage</text><text x="320" y="76" fill="#93a1b3" font-size="11" font-weight="400" text-anchor="middle">unverbindlich</text><line x1="526" y1="110" x2="116" y2="110" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#vt-ar)"/><text x="320" y="102" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">Angebot</text><text x="320" y="126" fill="#93a1b3" font-size="11" font-weight="400" text-anchor="middle">Antrag (bindend, wenn nicht „freibleibend“)</text><line x1="114" y1="160" x2="524" y2="160" stroke="#34d399" stroke-width="1.8" marker-end="url(#vt-ar)"/><text x="320" y="152" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">Bestellung</text><text x="320" y="176" fill="#93a1b3" font-size="11" font-weight="400" text-anchor="middle">Annahme → Vertrag geschlossen</text><line x1="526" y1="210" x2="116" y2="210" stroke="#93a1b3" stroke-width="1.8" marker-end="url(#vt-ar)"/><text x="320" y="202" fill="#93a1b3" font-size="12" font-weight="700" text-anchor="middle">Auftragsbestätigung</text><text x="320" y="226" fill="#93a1b3" font-size="11" font-weight="400" text-anchor="middle">nur nötig, wenn noch kein Vertrag besteht</text><line x1="526" y1="260" x2="116" y2="260" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#vt-ar)"/><text x="320" y="252" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Lieferung + Rechnung</text><text x="320" y="276" fill="#93a1b3" font-size="11" font-weight="400" text-anchor="middle">Erfüllung des Vertrags</text></svg>