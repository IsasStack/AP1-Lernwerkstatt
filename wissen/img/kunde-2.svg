<svg xmlns="http://www.w3.org/2000/svg" width="660" height="290" font-family="Inter,Arial,sans-serif" font-size="12" viewBox="0 0 660 290" role="img" aria-label="Vier-Seiten-Modell nach Schulz von Thun mit Beispiel"><rect x="0" y="0" width="100%" height="100%" fill="#0f141b"/><polygon points="330,40 422,132 330,224 238,132" fill="#1b2430" stroke="#38bdf8" stroke-width="1.5"/><text x="330" y="128" fill="#d7dee8" font-size="12" font-weight="700" text-anchor="middle">Nachricht</text><text x="330" y="146" fill="#93a1b3" font-size="11" font-weight="400" text-anchor="middle">„Der Drucker geht</text><text x="330" y="160" fill="#93a1b3" font-size="11" font-weight="400" text-anchor="middle">schon wieder nicht!“</text><text x="330" y="10" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Sachinhalt</text><text x="330" y="26" fill="#d7dee8" font-size="11.5" font-weight="400" text-anchor="middle">Der Drucker ist defekt.</text><text x="440" y="126" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="start">Appell</text><text x="440" y="142" fill="#d7dee8" font-size="11.5" font-weight="400" text-anchor="start">Repariert ihn endlich</text><text x="330" y="246" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle">Beziehung</text><text x="330" y="262" fill="#d7dee8" font-size="11.5" font-weight="400" text-anchor="middle">Ihr kriegt das nicht hin.</text><text x="220" y="126" fill="#a78bfa" font-size="12" font-weight="700" text-anchor="end">Selbstoffenbarung</text><text x="220" y="142" fill="#d7dee8" font-size="11.5" font-weight="400" text-anchor="end">Ich bin genervt.</text><text x="440" y="158" fill="#d7dee8" font-size="11.5" font-weight="400" text-anchor="start">– und zwar dauerhaft!</text></svg>