<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" font-family="Inter,Arial,sans-serif" font-size="12" viewBox="0 0 680 340" role="img" aria-label="Richtig eingestellter Bildschirmarbeitsplatz in der Seitenansicht"><rect x="0" y="0" width="100%" height="100%" fill="#0f141b"/><defs><marker id="eg-a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#fbbf24"/></marker><marker id="eg-b" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#fbbf24"/></marker></defs><line x1="20" y1="330" x2="660" y2="330" stroke="#334255" stroke-width="2"/><rect x="300" y="200" width="300" height="10" fill="#93a1b3"/><line x1="580" y1="210" x2="580" y2="330" stroke="#93a1b3" stroke-width="5"/><line x1="520" y1="200" x2="520" y2="170" stroke="#93a1b3" stroke-width="5"/><rect x="495" y="196" width="50" height="5" fill="#93a1b3"/><line x1="534" y1="80" x2="520" y2="172" stroke="#38bdf8" stroke-width="9" stroke-linecap="round"/><rect x="340" y="194" width="60" height="6" rx="2" fill="#93a1b3"/><rect x="150" y="235" width="110" height="10" rx="4" fill="#93a1b3"/><path d="M150,240 L130,120" stroke="#93a1b3" stroke-width="8" stroke-linecap="round"/><line x1="205" y1="245" x2="205" y2="300" stroke="#93a1b3" stroke-width="6"/><line x1="160" y1="322" x2="250" y2="322" stroke="#93a1b3" stroke-width="5"/><circle cx="160" cy="326" r="4" fill="#93a1b3"/><circle cx="250" cy="326" r="4" fill="#93a1b3"/><circle cx="185" cy="78" r="20" fill="none" stroke="#34d399" stroke-width="3"/><path d="M180,98 L170,228 L262,228 L262,324 L292,324" fill="none" stroke="#34d399" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M176,130 L200,195 L345,195" fill="none" stroke="#34d399" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line x1="200" y1="76" x2="534" y2="76" stroke="#fbbf24" stroke-dasharray="5 4"/><text x="360" y="68" fill="#fbbf24" font-size="11" font-weight="400" text-anchor="middle">Augenhöhe = Oberkante Monitor oder leicht darüber</text><line x1="210" y1="112" x2="505" y2="112" stroke="#fbbf24" marker-start="url(#eg-b)" marker-end="url(#eg-a)"/><text x="360" y="104" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">Sehabstand ca. 50–70 cm</text><text x="275" y="262" fill="#d7dee8" font-size="11" font-weight="400" text-anchor="start">Oberschenkel waagerecht,</text><text x="275" y="277" fill="#d7dee8" font-size="11" font-weight="400" text-anchor="start">Knie ca. 90°</text><text x="300" y="316" fill="#d7dee8" font-size="11" font-weight="400" text-anchor="start">Füße flach auf dem Boden</text><text x="355" y="228" fill="#d7dee8" font-size="11" font-weight="400" text-anchor="start">Unterarme waagerecht, Tisch auf Ellenbogenhöhe</text><text x="560" y="120" fill="#38bdf8" font-size="11" font-weight="400" text-anchor="start">Monitor leicht</text><text x="560" y="135" fill="#38bdf8" font-size="11" font-weight="400" text-anchor="start">nach hinten geneigt</text><text x="40" y="140" fill="#93a1b3" font-size="11" font-weight="400" text-anchor="start">Rücken-</text><text x="40" y="155" fill="#93a1b3" font-size="11" font-weight="400" text-anchor="start">lehne mit</text><text x="40" y="170" fill="#93a1b3" font-size="11" font-weight="400" text-anchor="start">Lordosen-</text><text x="40" y="185" fill="#93a1b3" font-size="11" font-weight="400" text-anchor="start">stütze</text><text x="40" y="24" fill="#93a1b3" font-size="11" font-weight="400" text-anchor="start">Fenster seitlich – Blickrichtung parallel zum Fenster</text></svg>