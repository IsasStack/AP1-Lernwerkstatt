<svg xmlns="http://www.w3.org/2000/svg" width="620" height="322" font-family="Inter,Arial,sans-serif" font-size="12" viewBox="0 0 620 322" role="img" aria-label="Strukturierte Fehlersuche im Netzwerk von unten nach oben"><rect x="0" y="0" width="100%" height="100%" fill="#0f141b"/><rect x="10" y="10" width="190" height="44" rx="7" fill="#1b2430" stroke="#38bdf8" stroke-width="1.5"/><text x="105" y="37" fill="#d7dee8" font-size="11" font-family="monospace" text-anchor="middle">ipconfig /all</text><text x="215" y="29" fill="#d7dee8" font-size="11.5" font-weight="400" text-anchor="start">Hat der PC eine gültige Adresse, Maske, Gateway, DNS?</text><text x="215" y="46" fill="#f87171" font-size="11" font-weight="400" text-anchor="start">169.254.x.x → DHCP/Kabel/VLAN prüfen</text><line x1="105" y1="54" x2="105" y2="68" stroke="#34d399" stroke-width="2"/><rect x="10" y="68" width="190" height="44" rx="7" fill="#1b2430" stroke="#38bdf8" stroke-width="1.5"/><text x="105" y="95" fill="#d7dee8" font-size="11" font-family="monospace" text-anchor="middle">ping 127.0.0.1</text><text x="215" y="87" fill="#d7dee8" font-size="11.5" font-weight="400" text-anchor="start">Funktioniert der TCP/IP-Stack?</text><text x="215" y="104" fill="#f87171" font-size="11" font-weight="400" text-anchor="start">nein → Netzwerkkarte, Treiber</text><line x1="105" y1="112" x2="105" y2="126" stroke="#34d399" stroke-width="2"/><rect x="10" y="126" width="190" height="44" rx="7" fill="#1b2430" stroke="#38bdf8" stroke-width="1.5"/><text x="105" y="153" fill="#d7dee8" font-size="11" font-family="monospace" text-anchor="middle">ping Gateway</text><text x="215" y="145" fill="#d7dee8" font-size="11.5" font-weight="400" text-anchor="start">Ist das eigene Netz erreichbar?</text><text x="215" y="162" fill="#f87171" font-size="11" font-weight="400" text-anchor="start">nein → Kabel, Switchport, VLAN, IP/Maske</text><line x1="105" y1="170" x2="105" y2="184" stroke="#34d399" stroke-width="2"/><rect x="10" y="184" width="190" height="44" rx="7" fill="#1b2430" stroke="#38bdf8" stroke-width="1.5"/><text x="105" y="211" fill="#d7dee8" font-size="11" font-family="monospace" text-anchor="middle">ping 8.8.8.8 (externe IP)</text><text x="215" y="203" fill="#d7dee8" font-size="11.5" font-weight="400" text-anchor="start">Kommt man ins Internet?</text><text x="215" y="220" fill="#f87171" font-size="11" font-weight="400" text-anchor="start">nein → Router, Firewall, Provider</text><line x1="105" y1="228" x2="105" y2="242" stroke="#34d399" stroke-width="2"/><rect x="10" y="242" width="190" height="44" rx="7" fill="#1b2430" stroke="#38bdf8" stroke-width="1.5"/><text x="105" y="269" fill="#d7dee8" font-size="11" font-family="monospace" text-anchor="middle">ping www.beispiel.de</text><text x="215" y="261" fill="#d7dee8" font-size="11.5" font-weight="400" text-anchor="start">Funktioniert die Namensauflösung?</text><text x="215" y="278" fill="#f87171" font-size="11" font-weight="400" text-anchor="start">nein, aber IP geht → DNS (nslookup)</text><text x="10" y="312" fill="#34d399" font-size="11" font-weight="400" text-anchor="start">Von unten nach oben prüfen: Jeder erfolgreiche Schritt schließt die Ebenen darunter als Ursache aus.</text></svg>