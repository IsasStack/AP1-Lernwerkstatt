<svg xmlns="http://www.w3.org/2000/svg" width="560" height="124" font-family="Inter,Arial,sans-serif" font-size="12" viewBox="0 0 560 124" role="img" aria-label="Aufbau eines Vorgangsknotens im Netzplan"><rect x="0" y="0" width="100%" height="100%" fill="#0f141b"/><defs><marker id="lg-ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#93a1b3"/></marker><marker id="lg-arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#f87171"/></marker></defs><rect x="20" y="14" width="210" height="96" rx="4" fill="#1b2430" stroke="#38bdf8"/><line x1="20" y1="44" x2="230" y2="44" stroke="#334255"/><line x1="20" y1="80" x2="230" y2="80" stroke="#334255"/><line x1="90.0" y1="14" x2="90.0" y2="44" stroke="#334255"/><line x1="90.0" y1="80" x2="90.0" y2="110" stroke="#334255"/><line x1="160.0" y1="14" x2="160.0" y2="44" stroke="#334255"/><line x1="160.0" y1="80" x2="160.0" y2="110" stroke="#334255"/><text x="55.0" y="34" fill="#d7dee8" font-size="12" font-weight="700" text-anchor="middle">FAZ</text><text x="125.0" y="34" fill="#d7dee8" font-size="12" font-weight="700" text-anchor="middle">D</text><text x="195.0" y="34" fill="#d7dee8" font-size="12" font-weight="700" text-anchor="middle">FEZ</text><text x="55.0" y="100" fill="#d7dee8" font-size="12" font-weight="700" text-anchor="middle">SAZ</text><text x="125.0" y="100" fill="#d7dee8" font-size="12" font-weight="700" text-anchor="middle">GP</text><text x="195.0" y="100" fill="#d7dee8" font-size="12" font-weight="700" text-anchor="middle">SEZ</text><text x="125.0" y="67" fill="#93a1b3" font-size="12" font-weight="400" text-anchor="middle">Nr.: Vorgangsname</text><text x="260" y="26" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="start">FAZ</text><text x="300" y="26" fill="#d7dee8" font-size="12" font-weight="400" text-anchor="start">frühester Anfangszeitpunkt</text><text x="260" y="43" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="start">D</text><text x="300" y="43" fill="#d7dee8" font-size="12" font-weight="400" text-anchor="start">Dauer</text><text x="260" y="60" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="start">FEZ</text><text x="300" y="60" fill="#d7dee8" font-size="12" font-weight="400" text-anchor="start">frühester Endzeitpunkt = FAZ + D</text><text x="260" y="77" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="start">SAZ</text><text x="300" y="77" fill="#d7dee8" font-size="12" font-weight="400" text-anchor="start">spätester Anfangszeitpunkt = SEZ − D</text><text x="260" y="94" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="start">GP</text><text x="300" y="94" fill="#d7dee8" font-size="12" font-weight="400" text-anchor="start">Gesamtpuffer = SAZ − FAZ</text><text x="260" y="111" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="start">SEZ</text><text x="300" y="111" fill="#d7dee8" font-size="12" font-weight="400" text-anchor="start">spätester Endzeitpunkt</text></svg>